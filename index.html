<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Live Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* VIDEO SECTION - TOP FULL WIDTH */
        .video-container {
            width: 100%;
            height: 35%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #333;
            position: relative;
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .video-btn {
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            border-radius: 3px;
        }

        .video-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        /* TEAMS SECTION - TWO COLUMNS */
        .teams-container {
            display: flex;
            flex: 1;
            width: 100%;
        }

        .team-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 3px solid #333;
            overflow-y: auto;
            position: relative;
        }

        .team-side:last-child {
            border-right: none;
        }

        /* TEAM HEADER */
        .team-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .team-name {
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .team-score {
            font-size: 64px;
            font-weight: bold;
            margin: 10px 0;
            color: #4ade80;
        }

        .team-record {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }

        .game-status {
            font-size: 12px;
            color: #f97316;
            font-weight: bold;
        }

        /* STATS SELECTOR BUTTONS */
        .stats-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .stat-btn {
            padding: 8px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 0;
            transition: all 0.2s;
        }

        .stat-btn:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .stat-btn.active {
            background: #444;
            color: #fff;
            border-color: #666;
        }

        /* STATS CONTENT */
        .stats-content {
            flex: 1;
            overflow-y: auto;
        }

        /* TEAM STATS TABLE */
        .team-stats-table {
            width: 100%;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #222;
            font-size: 13px;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #888;
            flex: 1;
        }

        .stat-value {
            font-weight: bold;
            color: #fff;
            font-size: 16px;
            min-width: 50px;
            text-align: right;
        }

        /* PLAYER CARDS */
        .player-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .player-card:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .player-card.selected {
            border-color: #4ade80;
            background: #1a2a1a;
        }

        .player-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .player-info {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }

        .player-stat {
            text-align: center;
            background: #0a0a0a;
            padding: 6px;
            border-radius: 3px;
        }

        .player-stat-value {
            font-weight: bold;
            color: #4ade80;
            font-size: 14px;
        }

        .player-stat-label {
            color: #666;
            font-size: 10px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* CONTROLS */
        .controls {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .control-btn {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 3px;
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.95);
            border-color: #888;
        }

        /* START OVERLAY */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 30px;
        }

        .start-overlay.hidden {
            display: none;
        }

        .start-overlay h1 {
            font-size: 72px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .start-button {
            padding: 15px 40px;
            background: #ff6b35;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-button:hover {
            background: #ff8555;
        }

        .touchdown-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 140px;
            font-weight: bold;
            color: #ff6b35;
            z-index: 999;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: slam 1s ease-out;
            text-shadow: 0 0 30px #ff6b35;
        }

        @keyframes slam {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5) rotate(-10deg);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2) rotate(5deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="startOverlay">
        <h1>NBA DASHBOARD</h1>
        <button class="start-button" id="startButton">START</button>
    </div>

    <div class="container" id="mainApp" style="display: none;">
        <!-- VIDEO FEED - FULL WIDTH TOP -->
        <div class="video-container">
            <video id="videoFeed" playsinline></video>
            <div class="video-controls">
                <button class="video-btn" id="toggleCameraBtn">📷 CAMERA</button>
                <button class="video-btn" id="toggleFullscreenVideoBtn">⛶ FULLSCREEN</button>
            </div>
        </div>

        <!-- TEAMS SECTION -->
        <div class="teams-container">
            <!-- AWAY TEAM -->
            <div class="team-side" id="teamSideLeft">
                <div class="team-header">
                    <div class="team-name" id="teamNameLeft">Away</div>
                    <div class="team-score" id="teamScoreLeft">0</div>
                    <div class="team-record" id="teamRecordLeft">0-0</div>
                    <div class="game-status" id="gameStatusLeft">--</div>
                </div>

                <div class="stats-selector">
                    <button class="stat-btn active" data-type="team" data-side="left">Team Stats</button>
                    <button class="stat-btn" data-type="players" data-side="left">Players</button>
                </div>

                <div class="stats-content" id="statsContentLeft">
                    <p style="color: #666;">Loading...</p>
                </div>
            </div>

            <!-- HOME TEAM -->
            <div class="team-side" id="teamSideRight">
                <div class="team-header">
                    <div class="team-name" id="teamNameRight">Home</div>
                    <div class="team-score" id="teamScoreRight">0</div>
                    <div class="team-record" id="teamRecordRight">0-0</div>
                    <div class="game-status" id="gameStatusRight">--</div>
                </div>

                <div class="stats-selector">
                    <button class="stat-btn active" data-type="team" data-side="right">Team Stats</button>
                    <button class="stat-btn" data-type="players" data-side="right">Players</button>
                </div>

                <div class="stats-content" id="statsContentRight">
                    <p style="color: #666;">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" id="refreshBtn">REFRESH</button>
        <button class="control-btn" id="fullscreenBtn">FULLSCREEN</button>
    </div>

    <script>
        const API_URL = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        let appState = {
            currentGame: null,
            audioContext: null,
            isAppStarted: false,
            selectedPlayers: { left: null, right: null },
            statType: { left: 'team', right: 'team' },
            videoStream: null,
            teamColors: {
                left: '#000',
                right: '#000'
            }
        };

        // NBA TEAM COLORS
        const NBA_COLORS = {
            'Atlanta Hawks': { primary: '#E03C28', secondary: '#C4CED4' },
            'Boston Celtics': { primary: '#007A33', secondary: '#BA9653' },
            'Brooklyn Nets': { primary: '#000000', secondary: '#FFFFFF' },
            'Charlotte Hornets': { primary: '#1D1160', secondary: '#00D4FF' },
            'Chicago Bulls': { primary: '#CE1141', secondary: '#000000' },
            'Cleveland Cavaliers': { primary: '#6F2DA8', secondary: '#041E42' },
            'Dallas Mavericks': { primary: '#00538C', secondary: '#002B5C' },
            'Denver Nuggets': { primary: '#0E2240', secondary: '#FEC52E' },
            'Detroit Pistons': { primary: '#C8102E', secondary: '#1D42BA' },
            'Golden State Warriors': { primary: '#1D428A', secondary: '#FFC72C' },
            'Houston Rockets': { primary: '#CE1141', secondary: '#000000' },
            'LA Clippers': { primary: '#C4CED4', secondary: '#1D428A' },
            'Los Angeles Lakers': { primary: '#552583', secondary: '#FDB827' },
            'Memphis Grizzlies': { primary: '#12173F', secondary: '#6189B9' },
            'Miami Heat': { primary: '#98002E', secondary: '#F9A01B' },
            'Milwaukee Bucks': { primary: '#12173F', secondary: '#EEE1C6' },
            'Minnesota Timberwolves': { primary: '#0C2340', secondary: '#236B3D' },
            'New Orleans Pelicans': { primary: '#0C2340', secondary: '#C4CED4' },
            'New York Knicks': { primary: '#F58426', secondary: '#0051BA' },
            'Oklahoma City Thunder': { primary: '#007AC1', secondary: '#EF3B39' },
            'Orlando Magic': { primary: '#0077B6', secondary: '#C4CED4' },
            'Philadelphia 76ers': { primary: '#1D428A', secondary: '#002B5C' },
            'Phoenix Suns': { primary: '#E56020', secondary: '#1D1160' },
            'Portland Trail Blazers': { primary: '#E03C28', secondary: '#000000' },
            'Sacramento Kings': { primary: '#5A2D81', secondary: '#63727A' },
            'San Antonio Spurs': { primary: '#C4CED4', secondary: '#000000' },
            'Toronto Raptors': { primary: '#CE1141', secondary: '#000000' },
            'Utah Jazz': { primary: '#002B5C', secondary: '#F9A825' },
            'Washington Wizards': { primary: '#002B5C', secondary: '#E31937' }
        };

        // ============ VIDEO SETUP ============
        async function setupVideo() {
            try {
                const videoFeed = document.getElementById('videoFeed');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                appState.videoStream = stream;
                videoFeed.srcObject = stream;
                videoFeed.play();
            } catch (error) {
                console.warn('Camera unavailable:', error);
                document.querySelector('.video-container').innerHTML = '<p style="color: #666;">Camera not available</p>';
            }
        }

        document.getElementById('toggleCameraBtn').addEventListener('click', async () => {
            if (appState.videoStream) {
                appState.videoStream.getTracks().forEach(track => track.stop());
                appState.videoStream = null;
                document.getElementById('videoFeed').srcObject = null;
            } else {
                await setupVideo();
            }
        });

        document.getElementById('toggleFullscreenVideoBtn').addEventListener('click', () => {
            const container = document.querySelector('.video-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.warn(err));
            } else {
                document.exitFullscreen();
            }
        });

        // ============ AUDIO SETUP ============
        function initAudioContext() {
            if (!appState.audioContext) {
                appState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (appState.audioContext.state === 'suspended') {
                appState.audioContext.resume();
            }
        }

        async function playSound(soundFile) {
            try {
                initAudioContext();
                const response = await fetch(`sounds/${soundFile}`);
                if (!response.ok) return;
                const audioBuffer = await response.arrayBuffer();
                const buffer = await appState.audioContext.decodeAudioData(audioBuffer);
                const source = appState.audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(appState.audioContext.destination);
                source.start(0);
            } catch (error) {
                console.warn('Audio error:', error);
            }
        }

        function triggerSlam() {
            playSound('touchdown.mp3');
            const animation = document.createElement('div');
            animation.className = 'touchdown-animation';
            animation.textContent = 'SLAM!';
            document.body.appendChild(animation);
            setTimeout(() => animation.remove(), 1000);
        }

        function triggerDefense() {
            playSound('defense.mp3');
        }

        // ============ KEYBOARD CONTROLS ============
        document.addEventListener('keydown', (event) => {
            if (!appState.isAppStarted) return;
            const key = event.key.toUpperCase();
            if (key === 'T') {
                triggerSlam();
            } else if (key === 'D') {
                triggerDefense();
            }
        });

        // ============ START APP ============
        document.getElementById('startButton').addEventListener('click', async () => {
            appState.isAppStarted = true;
            initAudioContext();
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            await setupVideo();
            fetchGame();
        });

        // ============ FETCH DATA ============
        async function fetchGame() {
            try {
                const proxiedUrl = CORS_PROXY + encodeURIComponent(API_URL);
                const response = await fetch(proxiedUrl);
                if (!response.ok) throw new Error('Failed to fetch');

                const data = await response.json();
                const game = data.events?.[0];

                if (!game) {
                    document.getElementById('statsContentLeft').innerHTML = '<p style="color: #999;">No games today</p>';
                    document.getElementById('statsContentRight').innerHTML = '<p style="color: #999;">No games today</p>';
                    return;
                }

                appState.currentGame = game;
                renderGame();
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('statsContentLeft').innerHTML = '<p style="color: #f00;">Error loading</p>';
                document.getElementById('statsContentRight').innerHTML = '<p style="color: #f00;">Error loading</p>';
            }
        }

        function renderGame() {
            const game = appState.currentGame;
            const competitors = game.competitions?.[0]?.competitors || [];
            const away = competitors.find(c => c.homeAway === 'away');
            const home = competitors.find(c => c.homeAway === 'home');

            if (!away || !home) return;

            // Update team info
            document.getElementById('teamNameLeft').textContent = away.team?.displayName || 'Away';
            document.getElementById('teamScoreLeft').textContent = away.score || 0;
            document.getElementById('teamRecordLeft').textContent = away.records?.[0]?.summary || '0-0';
            document.getElementById('gameStatusLeft').textContent = game.competitions?.[0]?.status?.displayClock || '--';

            document.getElementById('teamNameRight').textContent = home.team?.displayName || 'Home';
            document.getElementById('teamScoreRight').textContent = home.score || 0;
            document.getElementById('teamRecordRight').textContent = home.records?.[0]?.summary || '0-0';
            document.getElementById('gameStatusRight').textContent = game.competitions?.[0]?.status?.displayClock || '--';

            // Apply team colors
            const leftColor = NBA_COLORS[away.team?.displayName]?.primary || '#111';
            const rightColor = NBA_COLORS[home.team?.displayName]?.primary || '#111';

            const hexToRgba = (hex, alpha) => {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            };

            document.getElementById('teamSideLeft').style.background = hexToRgba(leftColor, 0.15);
            document.getElementById('teamSideLeft').style.borderLeftColor = leftColor;
            document.getElementById('teamSideLeft').style.borderLeft = `6px solid ${leftColor}`;

            document.getElementById('teamSideRight').style.background = hexToRgba(rightColor, 0.15);
            document.getElementById('teamSideRight').style.borderLeftColor = rightColor;
            document.getElementById('teamSideRight').style.borderLeft = `6px solid ${rightColor}`;

            // Render stats
            renderStats('left', away);
            renderStats('right', home);
        }

        function renderStats(side, teamData) {
            const type = appState.statType[side];
            const contentId = `statsContent${side === 'left' ? 'Left' : 'Right'}`;

            if (type === 'team') {
                renderTeamStats(side, teamData);
            } else {
                renderPlayerStats(side, teamData);
            }
        }

        function renderTeamStats(side, teamData) {
            const stats = teamData.statistics || [];
            const contentId = `statsContent${side === 'left' ? 'Left' : 'Right'}`;

            const getStatValue = (name) => {
                const stat = stats.find(s => s.name === name);
                return stat?.displayValue || '--';
            };

            const html = `
                <div class="team-stats-table">
                    <div class="stat-row"><span class="stat-label">POINTS</span><span class="stat-value">${getStatValue('points')}</span></div>
                    <div class="stat-row"><span class="stat-label">REBOUNDS</span><span class="stat-value">${getStatValue('rebounds')}</span></div>
                    <div class="stat-row"><span class="stat-label">ASSISTS</span><span class="stat-value">${getStatValue('assists')}</span></div>
                    <div class="stat-row"><span class="stat-label">STEALS</span><span class="stat-value">${getStatValue('steals')}</span></div>
                    <div class="stat-row"><span class="stat-label">BLOCKS</span><span class="stat-value">${getStatValue('blocks')}</span></div>
                    <div class="stat-row"><span class="stat-label">TURNOVERS</span><span class="stat-value">${getStatValue('turnovers')}</span></div>
                    <div class="stat-row"><span class="stat-label">FG%</span><span class="stat-value">${getStatValue('fieldGoalsPercentage')}</span></div>
                    <div class="stat-row"><span class="stat-label">3PT%</span><span class="stat-value">${getStatValue('threePointersPercentage')}</span></div>
                    <div class="stat-row"><span class="stat-label">FT%</span><span class="stat-value">${getStatValue('freeThrowsPercentage')}</span></div>
                    <div class="stat-row"><span class="stat-label">FOULS</span><span class="stat-value">${getStatValue('personalFouls')}</span></div>
                </div>
            `;
            document.getElementById(contentId).innerHTML = html;
        }

        function renderPlayerStats(side, teamData) {
            const contentId = `statsContent${side === 'left' ? 'Left' : 'Right'}`;
            const players = teamData.players || [];

            if (players.length === 0) {
                document.getElementById(contentId).innerHTML = '<p style="color: #666;">No player data</p>';
                return;
            }

            let html = '';
            players.slice(0, 12).forEach(playerData => {
                const player = playerData.person || playerData;
                const stats = playerData.stats || [];

                const getPlayerStat = (name, index = 0) => {
                    const stat = stats.find(s => s.name === name);
                    return stat?.statistics?.[index]?.displayValue || '--';
                };

                const selected = appState.selectedPlayers[side]?.id === player.id ? 'selected' : '';

                html += `
                    <div class="player-card ${selected}" data-player-id="${player.id}" data-side="${side}">
                        <div class="player-name">#${playerData.jerseyNumber || '--'} ${player.displayName || 'Player'}</div>
                        <div class="player-info">${playerData.position?.displayName || 'Position'}</div>
                        <div class="player-stats">
                            <div class="player-stat">
                                <div class="player-stat-value">${getPlayerStat('points')}</div>
                                <div class="player-stat-label">PTS</div>
                            </div>
                            <div class="player-stat">
                                <div class="player-stat-value">${getPlayerStat('rebounds')}</div>
                                <div class="player-stat-label">REB</div>
                            </div>
                            <div class="player-stat">
                                <div class="player-stat-value">${getPlayerStat('assists')}</div>
                                <div class="player-stat-label">AST</div>
                            </div>
                            <div class="player-stat">
                                <div class="player-stat-value">${getPlayerStat('steals')}</div>
                                <div class="player-stat-label">STL</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById(contentId).innerHTML = html;

            // Add click handlers
            document.querySelectorAll(`.player-card[data-side="${side}"]`).forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll(`.player-card[data-side="${side}"].selected`).forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    appState.selectedPlayers[side] = {
                        id: card.dataset.playerId,
                        name: card.querySelector('.player-name').textContent
                    };
                });
            });
        }

        // ============ STATS BUTTON HANDLERS ============
        document.querySelectorAll('.stat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const side = e.target.dataset.side;
                const type = e.target.dataset.type;

                document.querySelectorAll(`.stat-btn[data-side="${side}"]`).forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                appState.statType[side] = type;

                const game = appState.currentGame;
                if (!game) return;

                const competitors = game.competitions?.[0]?.competitors || [];
                const teamData = side === 'left' 
                    ? competitors.find(c => c.homeAway === 'away')
                    : competitors.find(c => c.homeAway === 'home');

                if (teamData) {
                    renderStats(side, teamData);
                }
            });
        });

        // ============ CONTROLS ============
        document.getElementById('refreshBtn').addEventListener('click', fetchGame);

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            document.querySelector('.container').requestFullscreen().catch(err => console.warn(err));
        });

        // ============ AUTO REFRESH ============
        setInterval(() => {
            if (appState.isAppStarted) {
                fetchGame();
            }
        }, 30000);
    </script>
</body>
</html>
