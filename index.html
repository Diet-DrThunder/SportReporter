<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .container-main {
            display: flex;
            height: 100vh;
            width: 100vw;
            flex-direction: column;
        }

        .content-area {
            display: flex;
            flex: 1;
            gap: 0;
            overflow: hidden;
        }

        .video-placeholder {
            width: 80%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 2px solid #333;
        }

        .video-content {
            text-align: center;
            z-index: 10;
        }

        .video-content h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .video-content p {
            color: #666;
            font-size: 1.2rem;
        }

        .stats-sidebar {
            width: 20%;
            background: #0a0a0a;
            padding: 1.5rem;
            overflow-y: auto;
            border-left: 2px solid #333;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .sport-selector {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .sport-selector:hover {
            background: #2a2a2a;
        }

        .game-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #333;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .team-name {
            font-weight: 600;
        }

        .team-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ade80;
            min-width: 40px;
            text-align: right;
        }

        .game-time {
            font-size: 0.8rem;
            color: #888;
            padding: 0.5rem 0;
            text-align: center;
        }

        .game-status {
            font-size: 0.75rem;
            color: #f97316;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            background: rgba(249, 115, 22, 0.1);
            border-radius: 0.25rem;
            display: inline-block;
            margin-top: 0.5rem;
        }

        .game-details {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
            line-height: 1.4;
        }

        .score-ticker {
            background: #1a1a1a;
            border-top: 2px solid #333;
            padding: 1rem;
            display: flex;
            gap: 2rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
            padding: 0 1rem;
            border-right: 1px solid #333;
        }

        .ticker-item:last-child {
            border-right: none;
        }

        .ticker-teams {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .ticker-team {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .ticker-score {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4ade80;
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 2rem;
        }

        .start-overlay.hidden {
            display: none;
        }

        .start-overlay h1 {
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-overlay p {
            font-size: 1.2rem;
            color: #888;
        }

        .start-button {
            padding: 1rem 3rem;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        .start-button:active {
            transform: scale(0.95);
        }

        .control-buttons {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            z-index: 100;
        }

        .control-btn {
            padding: 0.5rem 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .touchdown-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            font-weight: bold;
            color: #ff6b6b;
            z-index: 999;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: touchdownPulse 1s ease-out;
            text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b;
        }

        @keyframes touchdownPulse {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8);
                text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b;
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
                text-shadow: 0 0 40px #ff6b6b, 0 0 80px #ff6b6b;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.2);
                text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #4ade80;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            margin: 0.5rem 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="startOverlay">
        <h1>Sports Dashboard</h1>
        <p>Click to Start (Required for Audio)</p>
        <button class="start-button" id="startButton">Start App</button>
    </div>

    <div class="container-main" id="mainApp" style="display: none;">
        <div class="control-buttons">
            <select id="sportSelector" class="sport-selector">
                <option value="nfl">🏈 NFL</option>
                <option value="nba">🏀 NBA</option>
                <option value="mlb">⚾ MLB</option>
            </select>
            <button class="control-btn" id="fullscreenBtn">Fullscreen</button>
            <button class="control-btn" id="refreshBtn">Refresh</button>
        </div>

        <div class="content-area">
            <div class="video-placeholder">
                <div class="video-content">
                    <h2>Broadcast Area</h2>
                    <p>Video Feed Goes Here</p>
                    <p style="font-size: 0.9rem; color: #666; margin-top: 2rem;">Press T for Touchdown, D for Defense</p>
                </div>
            </div>

            <div class="stats-sidebar" id="statsSidebar">
                <div class="stats-header">
                    <h3 style="font-size: 1.1rem; font-weight: 600;">Live Games</h3>
                    <div class="loading" id="loadingSpinner"></div>
                </div>
                <div id="gamesContainer">
                    <p style="color: #666; text-align: center; padding: 2rem 0;">Loading games...</p>
                </div>
            </div>
        </div>

        <div class="score-ticker" id="scoreTicker">
            <p style="color: #666; width: 100%; text-align: center;">Loading scores...</p>
        </div>
    </div>

    <script>
        // ============ Configuration ============
        const API_ENDPOINTS = {
            nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
            nba: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
            mlb: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard'
        };

        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        // ============ State Management ============
        let appState = {
            currentSport: 'nfl',
            games: [],
            audioContext: null,
            isAppStarted: false
        };

        // ============ Audio Setup ============
        function initAudioContext() {
            if (!appState.audioContext) {
                appState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (appState.audioContext.state === 'suspended') {
                appState.audioContext.resume();
            }
        }

        async function playSound(soundFile) {
            try {
                initAudioContext();
                const soundPath = `sounds/${soundFile}`;
                const response = await fetch(soundPath);
                if (!response.ok) {
                    console.warn(`Sound file not found: ${soundPath}`);
                    return;
                }
                const audioBuffer = await response.arrayBuffer();
                const buffer = await appState.audioContext.decodeAudioData(audioBuffer);
                const source = appState.audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(appState.audioContext.destination);
                source.start(0);
            } catch (error) {
                console.warn('Error playing sound:', error);
            }
        }

        // ============ Touchdown Animation ============
        function triggerTouchdown() {
            playSound('touchdown.mp3');
            const animation = document.createElement('div');
            animation.className = 'touchdown-animation';
            animation.textContent = 'TOUCHDOWN!';
            document.body.appendChild(animation);
            setTimeout(() => animation.remove(), 1000);
        }

        function triggerDefense() {
            playSound('defense.mp3');
        }

        // ============ Keyboard Controls ============
        document.addEventListener('keydown', (event) => {
            if (!appState.isAppStarted) return;
            const key = event.key.toUpperCase();
            if (key === 'T') {
                triggerTouchdown();
            } else if (key === 'D') {
                triggerDefense();
            }
        });

        // ============ Start App ============
        document.getElementById('startButton').addEventListener('click', () => {
            appState.isAppStarted = true;
            initAudioContext();
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            fetchAndDisplayGames();
        });

        // ============ API Fetching ============
        async function fetchAndDisplayGames() {
            try {
                const url = API_ENDPOINTS[appState.currentSport];
                const proxiedUrl = CORS_PROXY + encodeURIComponent(url);

                const response = await fetch(proxiedUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                appState.games = data.events || [];
                renderGames();
                renderTicker();
            } catch (error) {
                console.error('Error fetching games:', error);
                document.getElementById('gamesContainer').innerHTML = `
                    <div class="error-message">
                        Failed to load games. Retrying in 30 seconds...
                    </div>
                `;
            }
        }

        // ============ Rendering ============
        function renderGames() {
            const container = document.getElementById('gamesContainer');
            
            if (!appState.games || appState.games.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; padding: 2rem 0;">No games found</p>';
                return;
            }

            container.innerHTML = appState.games.map(game => {
                const competitors = game.competitions?.[0]?.competitors || [];
                const home = competitors.find(c => c.homeAway === 'home');
                const away = competitors.find(c => c.homeAway === 'away');
                const status = game.competitions?.[0]?.status || {};
                const clock = game.competitions?.[0]?.clock || 0;
                const situation = game.competitions?.[0]?.situation;

                return `
                    <div class="game-card">
                        <div class="game-header">
                            <span class="game-status">${status.type?.description || 'Scheduled'}</span>
                        </div>
                        
                        <div class="team-row">
                            <div class="team-info">
                                <div class="team-logo">${away?.team?.abbreviation || '?'}</div>
                                <span class="team-name">${away?.team?.displayName || 'Away'}</span>
                            </div>
                            <div class="team-score">${away?.score || '0'}</div>
                        </div>

                        <div class="team-row" style="border-bottom: 1px solid #333; padding-bottom: 0.5rem; margin-bottom: 0.5rem;">
                            <div class="team-info">
                                <div class="team-logo">${home?.team?.abbreviation || '?'}</div>
                                <span class="team-name">${home?.team?.displayName || 'Home'}</span>
                            </div>
                            <div class="team-score">${home?.score || '0'}</div>
                        </div>

                        <div class="game-time">
                            ${status.displayClock || 'TBD'}
                        </div>

                        <div class="game-details">
                            ${situation ? `
                                <div>Down: ${situation.down || '-'} &nbsp;|&nbsp; Distance: ${situation.yardLine || '-'}</div>
                            ` : ''}
                            <div style="margin-top: 0.3rem; color: #666;">${game.competitions?.[0]?.venue?.fullName || 'TBD'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTicker() {
            const ticker = document.getElementById('scoreTicker');

            if (!appState.games || appState.games.length === 0) {
                ticker.innerHTML = '<p style="color: #666; width: 100%; text-align: center;">No games available</p>';
                return;
            }

            ticker.innerHTML = appState.games.map(game => {
                const competitors = game.competitions?.[0]?.competitors || [];
                const home = competitors.find(c => c.homeAway === 'home');
                const away = competitors.find(c => c.homeAway === 'away');
                const status = game.competitions?.[0]?.status || {};

                return `
                    <div class="ticker-item">
                        <div class="ticker-teams">
                            <span class="ticker-team">${away?.team?.abbreviation || 'Away'}</span>
                            <span class="ticker-score">${away?.score || '0'}</span>
                            <span style="color: #666;">@</span>
                            <span class="ticker-team">${home?.team?.abbreviation || 'Home'}</span>
                            <span class="ticker-score">${home?.score || '0'}</span>
                        </div>
                        <div style="font-size: 0.75rem; color: #888; margin-left: 0.5rem;">${status.displayClock || ''}</div>
                    </div>
                `;
            }).join('');
        }

        // ============ Event Listeners ============
        document.getElementById('sportSelector').addEventListener('change', (e) => {
            appState.currentSport = e.target.value;
            fetchAndDisplayGames();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchAndDisplayGames();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const mainApp = document.getElementById('mainApp');
            if (!document.fullscreenElement) {
                mainApp.requestFullscreen().catch(err => {
                    console.warn('Fullscreen request failed:', err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // ============ Auto-Refresh ============
        setInterval(() => {
            if (appState.isAppStarted) {
                fetchAndDisplayGames();
            }
        }, 30000); // 30 seconds
    </script>
</body>
</html>
