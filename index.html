<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #000;
            padding: 1.5rem;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .team-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #222;
            overflow-y: auto;
            position: relative;
        }

        .team-side:last-child {
            border-right: none;
        }

        .team-side.left {
            border-right: 3px solid #C1272D;
        }

        .team-side.right {
            border-left: 3px solid #0C2340;
        }

        .team-header {
            padding: 2rem 2rem 1.5rem;
            background: linear-gradient(to bottom, #1a1a1a, #0f0f0f);
            border-bottom: 1px solid #222;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .team-logo {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            flex-shrink: 0;
        }

        .team-details h2 {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .team-details p {
            font-size: 0.9rem;
            color: #999;
            margin: 0.3rem 0;
        }

        .score-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding: 1rem 0;
            border-top: 1px solid #222;
        }

        .score {
            font-size: 3.5rem;
            font-weight: bold;
        }

        .game-time {
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            flex: 1;
        }

        .stats-container {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 1rem;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #888;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4ade80;
        }

        .player-section {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
        }

        .player-card {
            background: #1a1a1a;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 3px solid #333;
            cursor: pointer;
            transition: all 0.2s;
        }

        .player-card:hover {
            background: #252525;
            border-left-color: #555;
        }

        .player-card.selected {
            background: #252525;
            border-left-color: #4ade80;
        }

        .player-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.75rem;
        }

        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .player-stat {
            background: rgba(74, 222, 128, 0.1);
            padding: 0.5rem;
            border-radius: 4px;
            text-align: center;
            font-size: 0.8rem;
        }

        .player-stat-value {
            font-weight: bold;
            font-size: 1rem;
            color: #4ade80;
        }

        .player-stat-label {
            color: #888;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .stat-btn {
            padding: 0.7rem 1.5rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-right: 0.5rem;
            margin-bottom: 1rem;
        }

        .stat-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .stat-btn.active {
            background: #333;
            border-color: #555;
            color: #4ade80;
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 2rem;
        }

        .start-overlay.hidden {
            display: none;
        }

        .start-overlay h1 {
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
        }

        .start-overlay p {
            font-size: 1.1rem;
            color: #888;
        }

        .start-button {
            padding: 1rem 3rem;
            background: #C1272D;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
        }

        .start-button:hover {
            background: #a01f27;
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 2rem;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #dc2626;
            color: #fca5a5;
            padding: 1rem;
            margin: 1rem;
            border-radius: 4px;
            text-align: center;
        }

        .touchdown-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12rem;
            font-weight: bold;
            color: #C1272D;
            z-index: 999;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 8px;
            animation: slam 1s ease-out;
            text-shadow: 0 0 30px #C1272D, 0 0 60px #C1272D;
        }

        @keyframes slam {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5) rotateZ(-5deg);
                text-shadow: 0 0 20px #C1272D;
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2) rotateZ(2deg);
                text-shadow: 0 0 40px #C1272D, 0 0 80px #C1272D;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5) rotateZ(0deg);
                text-shadow: 0 0 20px #C1272D;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="startOverlay">
        <h1>NBA Live Dashboard</h1>
        <p>Click to Start</p>
        <button class="start-button" id="startButton">Start</button>
    </div>

    <div class="container" id="mainApp" style="display: none;">
        <div class="header">
            <div class="header-title">NBA LIVE</div>
            <div class="controls">
                <button class="btn" id="refreshBtn">Refresh</button>
                <button class="btn" id="fullscreenBtn">Fullscreen</button>
            </div>
        </div>

        <div class="content">
            <!-- LEFT TEAM -->
            <div class="team-side left">
                <div class="team-header">
                    <div class="team-info">
                        <div class="team-logo" id="leftTeamLogo">🏀</div>
                        <div class="team-details">
                            <h2 id="leftTeamName">Team</h2>
                            <p id="leftTeamRecord">0-0</p>
                            <p id="leftTeamStatus">--</p>
                        </div>
                    </div>
                    <div class="score-section">
                        <div class="score" id="leftScore">0</div>
                        <div class="game-time" id="gameTime">--</div>
                        <div style="width: 80px;"></div>
                    </div>
                </div>

                <div style="padding: 0 2rem;">
                    <button class="stat-btn active" data-view="team-left">Team Stats</button>
                    <button class="stat-btn" data-view="players-left">Players</button>
                </div>

                <div id="leftStatsContainer" class="stats-container">
                    <div class="loading">Loading stats...</div>
                </div>
            </div>

            <!-- RIGHT TEAM -->
            <div class="team-side right">
                <div class="team-header">
                    <div class="team-info">
                        <div class="team-logo" id="rightTeamLogo">🏀</div>
                        <div class="team-details">
                            <h2 id="rightTeamName">Team</h2>
                            <p id="rightTeamRecord">0-0</p>
                            <p id="rightTeamStatus">--</p>
                        </div>
                    </div>
                    <div class="score-section">
                        <div class="score" id="rightScore">0</div>
                        <div style="flex: 1;"></div>
                        <div style="width: 80px;"></div>
                    </div>
                </div>

                <div style="padding: 0 2rem;">
                    <button class="stat-btn active" data-view="team-right">Team Stats</button>
                    <button class="stat-btn" data-view="players-right">Players</button>
                </div>

                <div id="rightStatsContainer" class="stats-container">
                    <div class="loading">Loading stats...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        const NBA_API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';

        let appState = {
            isStarted: false,
            currentGame: null,
            audioContext: null,
            selectedView: { left: 'team', right: 'team' },
            selectedPlayers: { left: null, right: null }
        };

        // ============ Start App ============
        document.getElementById('startButton').addEventListener('click', () => {
            appState.isStarted = true;
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            fetchGame();
        });

        // ============ Fetch Game Data ============
        async function fetchGame() {
            try {
                const url = CORS_PROXY + encodeURIComponent(NBA_API);
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch');
                
                const data = await response.json();
                const game = data.events?.[0];
                
                if (!game) {
                    showError('No games available');
                    return;
                }

                appState.currentGame = game;
                renderGame();
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load game data');
            }
        }

        function showError(msg) {
            document.getElementById('leftStatsContainer').innerHTML = `<div class="error">${msg}</div>`;
            document.getElementById('rightStatsContainer').innerHTML = `<div class="error">${msg}</div>`;
        }

        // ============ Render Game ============
        function renderGame() {
            const game = appState.currentGame;
            const competitors = game.competitions?.[0]?.competitors || [];
            const away = competitors.find(c => c.homeAway === 'away');
            const home = competitors.find(c => c.homeAway === 'home');
            const status = game.competitions?.[0]?.status || {};
            const clock = game.competitions?.[0]?.clock || 0;
            const period = game.competitions?.[0]?.period || 0;

            if (!away || !home) return;

            // Update left side (away team)
            renderTeamHeader('left', away, game);
            renderTeamHeader('right', home, game);

            // Game time
            let timeStr = `Q${period} ${Math.floor(clock / 60)}:${String(Math.floor(clock % 60)).padStart(2, '0')}`;
            if (status.type?.description?.includes('Final')) timeStr = 'FINAL';
            document.getElementById('gameTime').textContent = timeStr;

            // Render stats
            renderTeamStats('left', away);
            renderTeamStats('right', home);
        }

        function renderTeamHeader(side, team, game) {
            const prefix = side === 'left' ? 'left' : 'right';
            document.getElementById(`${prefix}TeamLogo`).textContent = team.team?.abbreviation?.substring(0, 1) || '🏀';
            document.getElementById(`${prefix}TeamName`).textContent = team.team?.displayName || 'Team';
            document.getElementById(`${prefix}TeamRecord`).textContent = team.records?.[0]?.summary || '0-0';
            document.getElementById(`${prefix}Score`).textContent = team.score || '0';
            
            const status = game.competitions?.[0]?.status?.type?.description || 'Scheduled';
            document.getElementById(`${prefix}TeamStatus`).textContent = status;
        }

        function renderTeamStats(side, team) {
            const stats = team.statistics || [];
            const containerId = `${side}StatsContainer`;
            
            let html = '';

            // Extract all available stats
            const statMap = {
                'Field Goal %': stats.find(s => s.name === 'fieldGoalPct')?.displayValue || '--',
                'Three Point %': stats.find(s => s.name === 'threePointPct')?.displayValue || '--',
                'Free Throw %': stats.find(s => s.name === 'freeThrowPct')?.displayValue || '--',
                'Points': stats.find(s => s.name === 'points')?.displayValue || '--',
                'Rebounds': stats.find(s => s.name === 'rebounds')?.displayValue || '--',
                'Assists': stats.find(s => s.name === 'assists')?.displayValue || '--',
                'Steals': stats.find(s => s.name === 'steals')?.displayValue || '--',
                'Blocks': stats.find(s => s.name === 'blocks')?.displayValue || '--',
                'Turnovers': stats.find(s => s.name === 'turnovers')?.displayValue || '--',
                'Personal Fouls': stats.find(s => s.name === 'personalFouls')?.displayValue || '--',
                'Bench Points': stats.find(s => s.name === 'benchPoints')?.displayValue || '--',
                'Fast Break Points': stats.find(s => s.name === 'fastBreakPoints')?.displayValue || '--',
            };

            Object.entries(statMap).forEach(([label, value]) => {
                html += `
                    <div class="stat-row">
                        <span class="stat-label">${label}</span>
                        <span class="stat-value">${value}</span>
                    </div>
                `;
            });

            document.getElementById(containerId).innerHTML = html;
        }

        function renderPlayerStats(side, team) {
            const containerId = `${side}StatsContainer`;
            const players = team.players || [];

            if (players.length === 0) {
                document.getElementById(containerId).innerHTML = '<div class="error">No player data available</div>';
                return;
            }

            let html = '';
            players.forEach(playerData => {
                const person = playerData.person || {};
                const position = playerData.position?.abbreviation || 'N/A';
                const number = playerData.jerseyNumber || '--';

                const stats = playerData.stats || [];
                const points = stats.find(s => s.name === 'points')?.displayValue || '--';
                const rebounds = stats.find(s => s.name === 'rebounds')?.displayValue || '--';
                const assists = stats.find(s => s.name === 'assists')?.displayValue || '--';
                const steals = stats.find(s => s.name === 'steals')?.displayValue || '--';

                html += `
                    <div class="player-card">
                        <div class="player-name">${person.displayName || 'Player'}</div>
                        <div class="player-info">
                            <span>#${number} ${position}</span>
                        </div>
                        <div class="player-stats">
                            <div class="player-stat">
                                <div class="player-stat-value">${points}</div>
                                <div class="player-stat-label">Points</div>
                            </div>
                            <div class="player-stat">
                                <div class="player-stat-value">${rebounds}</div>
                                <div class="player-stat-label">Rebounds</div>
                            </div>
                            <div class="player-stat">
                                <div class="player-stat-value">${assists}</div>
                                <div class="player-stat-label">Assists</div>
                            </div>
                            <div class="player-stat">
                                <div class="player-stat-value">${steals}</div>
                                <div class="player-stat-label">Steals</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById(containerId).innerHTML = html;
        }

        // ============ View Switching ============
        document.querySelectorAll('.stat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const view = e.target.dataset.view;
                const [type, side] = view.split('-');
                
                // Update active button
                const container = e.target.parentElement;
                container.querySelectorAll('.stat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                // Switch view
                const game = appState.currentGame;
                if (!game) return;

                const competitors = game.competitions?.[0]?.competitors || [];
                const team = side === 'left' 
                    ? competitors.find(c => c.homeAway === 'away')
                    : competitors.find(c => c.homeAway === 'home');

                if (!team) return;

                if (type === 'team') {
                    renderTeamStats(side, team);
                } else {
                    renderPlayerStats(side, team);
                }
            });
        });

        // ============ Controls ============
        document.getElementById('refreshBtn').addEventListener('click', fetchGame);
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const container = document.getElementById('mainApp');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.warn('Fullscreen failed'));
            } else {
                document.exitFullscreen();
            }
        });

        // ============ Keyboard Controls ============
        document.addEventListener('keydown', (e) => {
            if (!appState.isStarted) return;
            
            if (e.key.toUpperCase() === 'T') {
                const animation = document.createElement('div');
                animation.className = 'touchdown-animation';
                animation.textContent = 'SLAM!';
                document.body.appendChild(animation);
                setTimeout(() => animation.remove(), 1000);
            } else if (e.key.toUpperCase() === 'D') {
                // Defense sound would go here
                console.log('Defense!');
            }
        });

        // ============ Auto-Refresh ============
        setInterval(() => {
            if (appState.isStarted) fetchGame();
        }, 30000);
    </script>
</body>
</html>
