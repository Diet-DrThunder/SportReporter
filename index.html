<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatBars - NBA Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #000;
            padding: 1rem 2rem;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            height: 70px;
        }

        .header-title {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .header-title .stat {
            color: #1f41bb;
        }

        .header-title .bars {
            color: #ce1141;
        }

        .game-selector {
            flex: 1;
            margin: 0 2rem;
        }

        .game-selector select {
            width: 100%;
            max-width: 400px;
            padding: 0.8rem 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 3px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-selector select:hover {
            border-color: #555;
            background: #252525;
        }

        .controls {
            display: flex;
            gap: 0.8rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            flex-direction: column;
            padding: 0;
        }

        /* Theatre Mode - Black bars on top and bottom */
        .theatre-bar {
            height: 80px;
            background: #000;
            flex-shrink: 0;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
            gap: 20px;
            padding: 20px;
        }

        /* Stats Panels */
        .stats-panel {
            width: 20%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 8px;
            min-width: 250px;
        }

        .stats-panel.left {
            margin-right: 10px;
        }

        .stats-panel.right {
            margin-left: 10px;
        }

        .panel-gradient {
            background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 100%);
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            border: 3px solid;
            overflow: hidden;
        }

        .panel-header {
            padding: 1.5rem;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
            background: rgba(0,0,0,0.5);
        }

        .panel-team-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .panel-team-logo {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            flex-shrink: 0;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .panel-team-name {
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .panel-team-record {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            margin-top: 0.5rem;
        }

        .view-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .view-btn {
            flex: 1;
            padding: 0.7rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 3px;
        }

        .view-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .view-btn.active {
            background: rgba(255,255,255,0.3);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .stat-row {
            display: flex;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            gap: 1rem;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: rgba(255,255,255,0.7);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            min-width: 60px;
            letter-spacing: 0.5px;
        }

        .stat-value-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .stat-bar-container {
            flex: 1;
            height: 28px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.15);
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0.4), rgba(255,255,255,0.8));
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 0.6rem;
        }

        .stat-bar-text {
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            min-width: 50px;
            text-align: right;
        }

        /* Center Broadcast */
        .center-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
        }

        .broadcast-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            position: relative;
            overflow: hidden;
        }

        .broadcast-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
        }

        .broadcast-placeholder svg {
            width: 150px;
            height: 150px;
            opacity: 0.2;
        }

        .broadcast-placeholder p {
            color: #555;
            font-size: 1.5rem;
        }

        .game-info-bar {
            background: rgba(0,0,0,0.95);
            border-top: 2px solid #333;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 3rem;
        }

        .team-scoreline {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex: 1;
        }

        .team-score {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .team-name {
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-large {
            font-size: 3.5rem;
            font-weight: bold;
            min-width: 100px;
        }

        .game-time-center {
            text-align: center;
            flex: 1;
        }

        .game-time-center .status {
            font-size: 0.95rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-time-center .time {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
        }

        /* Game Selector */
        .game-selector-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 3rem;
        }

        .game-selector-overlay.hidden {
            display: none;
        }

        .selector-content h1 {
            font-size: 5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .selector-content h1 .stat {
            color: #1f41bb;
        }

        .selector-content h1 .bars {
            color: #ce1141;
        }

        .selector-content p {
            font-size: 1.3rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .game-options {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
        }

        .game-option {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            flex: 0 1 350px;
        }

        .game-option:hover {
            border-color: #1f41bb;
            background: #252525;
            transform: translateY(-4px);
        }

        .game-option-matchup {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .game-option-status {
            font-size: 1rem;
            color: #888;
        }

        .test-button {
            padding: 1.2rem 3rem;
            background: #ce1141;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .test-button:hover {
            background: #a80d33;
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 2rem 1rem;
            font-size: 1.1rem;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <!-- Game Selection Overlay -->
    <div class="game-selector-overlay" id="gameSelector">
        <div class="selector-content">
            <h1><span class="stat">Stat</span><span class="bars">Bars</span></h1>
            <p>Select a game to begin</p>
            <div class="game-options">
                <div id="liveGamesContainer"></div>
                <button class="test-button" id="testModeBtn">TEST MODE</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="container" id="mainApp" style="display: none;">
        <!-- Header -->
        <div class="header">
            <div class="header-title"><span class="stat">Stat</span><span class="bars">Bars</span></div>
            <div class="game-selector">
                <select id="gameDropdown">
                    <option value="">Select Game</option>
                </select>
            </div>
            <div class="controls">
                <button class="btn" id="refreshBtn">Refresh</button>
                <button class="btn" id="homeBtn">Home</button>
                <button class="btn" id="fullscreenBtn">Fullscreen</button>
            </div>
        </div>

        <!-- Main Content - Theatre Mode -->
        <div class="main-content">
            <!-- Top Theatre Bar -->
            <div class="theatre-bar"></div>

            <!-- Content Wrapper -->
            <div class="content-wrapper">
                <!-- LEFT STATS PANEL -->
                <div class="stats-panel left">
                    <div class="panel-gradient" id="leftGradient">
                        <div class="panel-header">
                            <div class="panel-team-info">
                                <div class="panel-team-logo" id="leftTeamLogo"></div>
                                <div>
                                    <div class="panel-team-name" id="leftTeamName">Team</div>
                                    <div class="panel-team-record" id="leftTeamRecord">0-0</div>
                                </div>
                            </div>
                            <div class="view-buttons">
                                <button class="view-btn active" data-panel="left" data-view="team">Team</button>
                                <button class="view-btn" data-panel="left" data-view="players">Players</button>
                            </div>
                        </div>
                        <div class="panel-content" id="leftContent">
                            <div class="loading">Loading stats...</div>
                        </div>
                    </div>
                </div>

                <!-- CENTER BROADCAST -->
                <div class="center-section">
                    <div class="broadcast-container">
                        <div class="broadcast-placeholder">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                                <polyline points="17 2 12 7 7 2"></polyline>
                            </svg>
                            <p>Broadcast Video Here</p>
                        </div>
                    </div>
                    <div class="game-info-bar">
                        <div class="team-scoreline">
                            <div class="team-score">
                                <div>
                                    <div class="team-name" id="leftTeamNameScore">Away</div>
                                    <div class="score-large" id="leftScoreMain">0</div>
                                </div>
                            </div>
                        </div>
                        <div class="game-time-center">
                            <div class="status" id="gameStatus">--</div>
                            <div class="time" id="gameTimeMain">--</div>
                        </div>
                        <div class="team-scoreline" style="flex-direction: row-reverse;">
                            <div class="team-score">
                                <div>
                                    <div class="team-name" id="rightTeamNameScore">Home</div>
                                    <div class="score-large" id="rightScoreMain">0</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT STATS PANEL -->
                <div class="stats-panel right">
                    <div class="panel-gradient" id="rightGradient">
                        <div class="panel-header">
                            <div class="panel-team-info">
                                <div class="panel-team-logo" id="rightTeamLogo"></div>
                                <div>
                                    <div class="panel-team-name" id="rightTeamName">Team</div>
                                    <div class="panel-team-record" id="rightTeamRecord">0-0</div>
                                </div>
                            </div>
                            <div class="view-buttons">
                                <button class="view-btn active" data-panel="right" data-view="team">Team</button>
                                <button class="view-btn" data-panel="right" data-view="players">Players</button>
                            </div>
                        </div>
                        <div class="panel-content" id="rightContent">
                            <div class="loading">Loading stats...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Theatre Bar -->
            <div class="theatre-bar"></div>
        </div>
    </div>

            'UTA': '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="#f9a01b"/><text x="50" y="60" font-size="40" font-weight="bold" fill="#00471b" text-anchor="middle">J</text></svg>',
            'POR': '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="#e03828"/><text x="50" y="60" font-size="36" font-weight="bold" fill="#000" text-anchor="middle">POR</text></svg>',
            'CHO': '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="#00778d"/><text x="50" y="60" font-size="40" font-weight="bold" fill="#1ba1d7" text-anchor="middle">H</text></svg>',
            'WAS': '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="#002b5c"/><text x="50" y="60" font-size="40" font-weight="bold" fill="#f0163f" text-anchor="middle">W</text></svg>'
        };

        const TEAM_DATA = {
            'LAL': { name: 'Lakers', primary: '#1f41bb', secondary: '#fdb927' },
            'BOS': { name: 'Celtics', primary: '#007a33', secondary: '#ba9653' },
            'GSW': { name: 'Warriors', primary: '#1d428a', secondary: '#ffc72c' },
            'MIA': { name: 'Heat', primary: '#98002e', secondary: '#f9a01b' },
            'NYK': { name: 'Knicks', primary: '#0c2340', secondary: '#f58426' },
            'CHI': { name: 'Bulls', primary: '#ce1141', secondary: '#000000' },
            'DAL': { name: 'Mavericks', primary: '#003da5', secondary: '#b8c4ca' },
            'SAS': { name: 'Spurs', primary: '#c4ced4', secondary: '#000000' },
            'OKC': { name: 'Thunder', primary: '#007ac1', secondary: '#ef3b39' },
            'DEN': { name: 'Nuggets', primary: '#0e2240', secondary: '#ffb81c' },
            'PHX': { name: 'Suns', primary: '#e56021', secondary: '#1d1160' },
            'LAC': { name: 'Clippers', primary: '#c60c30', secondary: '#1d428a' },
            'MEM': { name: 'Grizzlies', primary: '#12173f', secondary: '#fdb827' },
            'NOP': { name: 'Pelicans', primary: '#0c2c56', secondary: '#c4ced4' },
            'MIN': { name: 'Timberwolves', primary: '#0c2340', secondary: '#236b8e' },
            'MIL': { name: 'Bucks', primary: '#12173f', secondary: '#eee1aa' },
            'TOR': { name: 'Raptors', primary: '#ce1141', secondary: '#000000' },
            'PHI': { name: '76ers', primary: '#1d428a', secondary: '#c4ced4' },
            'ATL': { name: 'Hawks', primary: '#e03828', secondary: '#061922' },
            'BKN': { name: 'Nets', primary: '#000000', secondary: '#ffffff' },
            'CLE': { name: 'Cavaliers', primary: '#6f2da8', secondary: '#041e42' },
            'DET': { name: 'Pistons', primary: '#c8102e', secondary: '#1d42ba' },
            'HOU': { name: 'Rockets', primary: '#ce1141', secondary: '#000000' },
            'IND': { name: 'Pacers', primary: '#002d62', secondary: '#fdbb2f' },
            'ORL': { name: 'Magic', primary: '#0072ce', secondary: '#c41e3a' },
            'SAC': { name: 'Kings', primary: '#5a2d81', secondary: '#63727a' },
            'UTA': { name: 'Jazz', primary: '#f9a01b', secondary: '#00471b' },
            'POR': { name: 'Trail Blazers', primary: '#e03828', secondary: '#000000' },
            'CHO': { name: 'Hornets', primary: '#00778d', secondary: '#1ba1d7' },
            'WAS': { name: 'Wizards', primary: '#002b5c', secondary: '#f0163f' }
        };

        const NBA_TEAMS = Object.entries(TEAM_DATA).map(([abbr, data]) => ({
            abbr,
            name: data.name,
            displayName: data.name,
            ...data
        }));

        let appState = {
            allGames: [],
            currentGame: null,
            currentGameId: null,
            isStarted: false,
            isTestMode: false,
            viewMode: { left: 'team', right: 'team' },
            refreshInterval: null
        };

        function getRandomTeam() {
            return NBA_TEAMS[Math.floor(Math.random() * NBA_TEAMS.length)];
        }

        function getRandomStats() {
            return {
                'fieldGoalPct': Math.floor(Math.random() * 40) + 40,
                'threePointPct': Math.floor(Math.random() * 40) + 20,
                'freeThrowPct': Math.floor(Math.random() * 30) + 70,
                'points': Math.floor(Math.random() * 60) + 80,
                'rebounds': Math.floor(Math.random() * 20) + 40,
                'assists': Math.floor(Math.random() * 20) + 20,
                'steals': Math.floor(Math.random() * 10) + 5,
                'blocks': Math.floor(Math.random() * 10) + 4,
                'turnovers': Math.floor(Math.random() * 15) + 10,
                'personalFouls': Math.floor(Math.random() * 10) + 15
            };
        }

        function generateTestGame() {
            const awayTeam = getRandomTeam();
            let homeTeam = getRandomTeam();
            while (homeTeam.abbr === awayTeam.abbr) {
                homeTeam = getRandomTeam();
            }

            const stats1 = getRandomStats();
            const stats2 = getRandomStats();

            return {
                id: 'test-game',
                competitions: [{
                    id: 'test',
                    clock: 1800,
                    period: 2,
                    status: { type: { description: 'In Progress' } },
                    competitors: [
                        {
                            homeAway: 'away',
                            score: Math.floor(Math.random() * 60) + 80,
                            team: { displayName: awayTeam.name, abbreviation: awayTeam.abbr },
                            records: [{ summary: '25-10' }],
                            statistics: [
                                { name: 'fieldGoalPct', displayValue: stats1.fieldGoalPct },
                                { name: 'threePointPct', displayValue: stats1.threePointPct },
                                { name: 'freeThrowPct', displayValue: stats1.freeThrowPct },
                                { name: 'points', displayValue: stats1.points },
                                { name: 'rebounds', displayValue: stats1.rebounds },
                                { name: 'assists', displayValue: stats1.assists },
                                { name: 'steals', displayValue: stats1.steals },
                                { name: 'blocks', displayValue: stats1.blocks },
                                { name: 'turnovers', displayValue: stats1.turnovers },
                                { name: 'personalFouls', displayValue: stats1.personalFouls }
                            ],
                            players: []
                        },
                        {
                            homeAway: 'home',
                            score: Math.floor(Math.random() * 60) + 80,
                            team: { displayName: homeTeam.name, abbreviation: homeTeam.abbr },
                            records: [{ summary: '28-8' }],
                            statistics: [
                                { name: 'fieldGoalPct', displayValue: stats2.fieldGoalPct },
                                { name: 'threePointPct', displayValue: stats2.threePointPct },
                                { name: 'freeThrowPct', displayValue: stats2.freeThrowPct },
                                { name: 'points', displayValue: stats2.points },
                                { name: 'rebounds', displayValue: stats2.rebounds },
                                { name: 'assists', displayValue: stats2.assists },
                                { name: 'steals', displayValue: stats2.steals },
                                { name: 'blocks', displayValue: stats2.blocks },
                                { name: 'turnovers', displayValue: stats2.turnovers },
                                { name: 'personalFouls', displayValue: stats2.personalFouls }
                            ],
                            players: []
                        }
                    ]
                }]
            };
        }

        // ============ Load Games on Start ============
        async function loadAvailableGames() {
            try {
                const url = CORS_PROXY + encodeURIComponent(NBA_API);
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch');
                
                const data = await response.json();
                appState.allGames = data.events || [];
                
                renderGameSelector();
            } catch (error) {
                console.error('Error:', error);
                const container = document.getElementById('liveGamesContainer');
                container.innerHTML = '<div class="loading">No live games available. Click TEST MODE to demo.</div>';
            }
        }

        function renderGameSelector() {
            const container = document.getElementById('liveGamesContainer');
            container.innerHTML = '';

            if (appState.allGames.length === 0) {
                return;
            }

            appState.allGames.slice(0, 2).forEach((game, index) => {
                const competitors = game.competitions?.[0]?.competitors || [];
                const away = competitors.find(c => c.homeAway === 'away');
                const home = competitors.find(c => c.homeAway === 'home');
                const status = game.competitions?.[0]?.status?.type?.description || 'Scheduled';

                if (!away || !home) return;

                const option = document.createElement('div');
                option.className = 'game-option';
                option.innerHTML = `
                    <div class="game-option-matchup">${away.team.displayName} @ ${home.team.displayName}</div>
                    <div class="game-option-status">${status}</div>
                `;
                option.addEventListener('click', () => selectGame(index));
                container.appendChild(option);
            });
        }

        function selectGame(gameIndex) {
            appState.currentGame = appState.allGames[gameIndex];
            appState.currentGameId = appState.currentGame.id;
            appState.isStarted = true;
            appState.isTestMode = false;

            document.getElementById('gameSelector').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';

            populateGameDropdown();
            renderGame();
            startAutoRefresh();
        }

        document.getElementById('testModeBtn').addEventListener('click', () => {
            appState.currentGame = generateTestGame();
            appState.currentGameId = 'test-game';
            appState.isStarted = true;
            appState.isTestMode = true;

            document.getElementById('gameSelector').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';

            renderGame();
        });

        function populateGameDropdown() {
            const dropdown = document.getElementById('gameDropdown');
            dropdown.innerHTML = '';

            appState.allGames.forEach((game, index) => {
                const competitors = game.competitions?.[0]?.competitors || [];
                const away = competitors.find(c => c.homeAway === 'away');
                const home = competitors.find(c => c.homeAway === 'home');

                if (!away || !home) return;

                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${away.team.displayName} @ ${home.team.displayName}`;
                if (game.id === appState.currentGameId) option.selected = true;
                dropdown.appendChild(option);
            });

            dropdown.addEventListener('change', (e) => {
                selectGame(parseInt(e.target.value));
            });
        }

        // ============ Render Game ============
        function renderGame() {
            const game = appState.currentGame;
            const competitors = game.competitions?.[0]?.competitors || [];
            const away = competitors.find(c => c.homeAway === 'away');
            const home = competitors.find(c => c.homeAway === 'home');
            const status = game.competitions?.[0]?.status || {};
            const clock = game.competitions?.[0]?.clock || 0;
            const period = game.competitions?.[0]?.period || 0;

            if (!away || !home) return;

            const awayTeamData = TEAM_DATA[away.team.abbreviation];
            const homeTeamData = TEAM_DATA[home.team.abbreviation];

            // Apply team colors and gradients to panels
            const leftGradient = document.getElementById('leftGradient');
            const rightGradient = document.getElementById('rightGradient');
            
            leftGradient.style.borderColor = awayTeamData.primary;
            leftGradient.style.background = `linear-gradient(135deg, ${awayTeamData.primary}22 0%, ${awayTeamData.secondary}11 100%)`;
            
            rightGradient.style.borderColor = homeTeamData.primary;
            rightGradient.style.background = `linear-gradient(135deg, ${homeTeamData.primary}22 0%, ${homeTeamData.secondary}11 100%)`;

            // Update team info with logos
            updateTeamPanel('left', away, awayTeamData);
            updateTeamPanel('right', home, homeTeamData);

            // Update center score
            document.getElementById('leftTeamNameScore').textContent = away.team.displayName;
            document.getElementById('rightTeamNameScore').textContent = home.team.displayName;
            document.getElementById('leftScoreMain').textContent = away.score || '0';
            document.getElementById('rightScoreMain').textContent = home.score || '0';

            // Update game time
            let timeStr = `Q${period} ${Math.floor(clock / 60)}:${String(Math.floor(clock % 60)).padStart(2, '0')}`;
            if (status.type?.description?.includes('Final')) timeStr = 'FINAL';
            document.getElementById('gameTimeMain').textContent = timeStr;
            document.getElementById('gameStatus').textContent = status.type?.description || 'Scheduled';

            // Render initial stats
            renderTeamStats('left', away, awayTeamData);
            renderTeamStats('right', home, homeTeamData);
        }

        function updateTeamPanel(side, team, teamData) {
            const prefix = side === 'left' ? 'left' : 'right';
            const logoElement = document.getElementById(`${prefix}TeamLogo`);
            const logoSvg = TEAM_LOGOS[team.team.abbreviation];
            logoElement.innerHTML = logoSvg || team.team?.abbreviation;
            document.getElementById(`${prefix}TeamName`).textContent = team.team?.displayName || 'Team';
            document.getElementById(`${prefix}TeamRecord`).textContent = team.records?.[0]?.summary || '0-0';
        }

        function renderTeamStats(side, team, teamData) {
            const stats = team.statistics || [];
            const containerId = `${side}Content`;

            const statMap = {
                'fieldGoalPct': { label: 'FG%', isPercentage: true },
                'threePointPct': { label: '3P%', isPercentage: true },
                'freeThrowPct': { label: 'FT%', isPercentage: true },
                'points': { label: 'Points', isPercentage: false },
                'rebounds': { label: 'Rebounds', isPercentage: false },
                'assists': { label: 'Assists', isPercentage: false },
                'steals': { label: 'Steals', isPercentage: false },
                'blocks': { label: 'Blocks', isPercentage: false },
                'turnovers': { label: 'Turnovers', isPercentage: false },
                'personalFouls': { label: 'Fouls', isPercentage: false },
            };

            let html = '';
            Object.entries(statMap).forEach(([key, config]) => {
                const stat = stats.find(s => s.name === key);
                const value = stat?.displayValue || '--';
                
                if (config.isPercentage && value !== '--') {
                    const numValue = parseFloat(value);
                    const barWidth = numValue;
                    html += `
                        <div class="stat-row">
                            <span class="stat-label">${config.label}</span>
                            <div class="stat-value-container">
                                <div class="stat-bar-container">
                                    <div class="stat-bar-fill" style="width: ${barWidth}%; background: linear-gradient(90deg, ${teamData.primary}88, ${teamData.secondary}cc);">
                                        <span class="stat-bar-text">${numValue}%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="stat-row">
                            <span class="stat-label">${config.label}</span>
                            <div class="stat-value-container">
                                <span class="stat-value">${value}</span>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById(containerId).innerHTML = html;
        }

        // ============ View Mode Switching ============
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const panel = e.target.dataset.panel;
                const view = e.target.dataset.view;

                e.target.parentElement.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                appState.viewMode[panel] = view;

                const game = appState.currentGame;
                const competitors = game.competitions?.[0]?.competitors || [];
                const team = panel === 'left' 
                    ? competitors.find(c => c.homeAway === 'away')
                    : competitors.find(c => c.homeAway === 'home');

                if (!team) return;

                if (view === 'team') {
                    const teamData = TEAM_DATA[team.team.abbreviation];
                    renderTeamStats(panel, team, teamData);
                }
            });
        });

        // ============ Refresh Data ============
        async function refreshGame() {
            if (appState.isTestMode) return;

            try {
                const url = CORS_PROXY + encodeURIComponent(NBA_API);
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch');
                
                const data = await response.json();
                const updatedGame = data.events?.find(g => g.id === appState.currentGameId);
                
                if (updatedGame) {
                    appState.currentGame = updatedGame;
                    renderGame();
                }
            } catch (error) {
                console.error('Refresh error:', error);
            }
        }

        function startAutoRefresh() {
            if (appState.refreshInterval) clearInterval(appState.refreshInterval);
            appState.refreshInterval = setInterval(refreshGame, 15000);
        }

        document.getElementById('refreshBtn').addEventListener('click', refreshGame);
        document.getElementById('homeBtn').addEventListener('click', () => {
            document.getElementById('gameSelector').classList.remove('hidden');
            document.getElementById('mainApp').style.display = 'none';
            if (appState.refreshInterval) clearInterval(appState.refreshInterval);
        });
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        loadAvailableGames();
    </script>
</body>
</html>
