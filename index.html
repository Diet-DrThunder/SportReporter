<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .projector-container {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        .projector-content {
            flex: 1;
            display: flex;
            width: 200vw;
            margin-left: -50vw;
        }

        .black-bars {
            background: #000;
            height: 60px;
        }

        .main-content {
            display: flex;
            flex: 1;
            width: 100%;
        }

        .team-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 3rem 2rem;
            position: relative;
            border-right: 4px solid #1a1a1a;
        }

        .team-section:last-child {
            border-right: none;
        }

        .team-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 3px solid rgba(255, 255, 255, 0.1);
        }

        .team-logo-large {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            border-radius: 0;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .team-name {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .team-score {
            font-size: 5rem;
            font-weight: 900;
            margin: 1rem 0;
            letter-spacing: -2px;
        }

        .team-record {
            font-size: 1.1rem;
            color: #888;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .game-status {
            font-size: 0.95rem;
            color: #aaa;
            padding: 0.75rem 0;
            margin-top: 1rem;
            font-weight: 500;
        }

        .stats-selector {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-btn {
            padding: 0.75rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #ccc;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .stat-btn.active {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
        }

        .stats-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 1.5rem;
        }

        .player-stats {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 0;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .player-stats:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .player-stats.selected {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .player-header {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            align-items: flex-start;
        }

        .player-photo {
            width: 100px;
            height: 100px;
            border-radius: 0;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-position {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-number {
            font-size: 1.2rem;
            color: #666;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 1rem;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 1rem;
            border-radius: 0;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            margin-top: 0.5rem;
            font-weight: 700;
        }

        .team-stats {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 0;
            padding: 2rem;
        }

        .team-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .team-stat-row:last-child {
            border-bottom: none;
        }

        .stat-name {
            font-size: 1rem;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
        }

        .video-section {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 320px;
            height: 240px;
            background: #000;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 0;
            overflow: hidden;
            z-index: 50;
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-controls {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            display: flex;
            gap: 0.5rem;
            z-index: 10;
        }

        .video-btn {
            padding: 0.5rem 0.75rem;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
            font-weight: 600;
        }

        .video-btn:hover {
            background: rgba(0, 0, 0, 0.95);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 3rem;
        }

        .start-overlay.hidden {
            display: none;
        }

        .start-overlay h1 {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-overlay p {
            font-size: 1.3rem;
            color: #666;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .start-button {
            padding: 1.5rem 4rem;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            font-size: 1.3rem;
            font-weight: 900;
            border: none;
            border-radius: 0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.6);
        }

        .start-button:active {
            transform: scale(0.95);
        }

        .control-buttons {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 100;
        }

        .control-btn {
            padding: 0.9rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .sport-selector {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 0.9rem 2rem;
            border-radius: 0;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .sport-selector:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .touchdown-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12rem;
            font-weight: 900;
            color: #ff6b6b;
            z-index: 999;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: touchdownPulse 1s ease-out;
            text-shadow: 0 0 40px #ff6b6b, 0 0 80px #ff6b6b;
        }

        @keyframes touchdownPulse {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6);
                text-shadow: 0 0 40px #ff6b6b, 0 0 80px #ff6b6b;
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.15);
                text-shadow: 0 0 60px #ff6b6b, 0 0 120px #ff6b6b;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.3);
                text-shadow: 0 0 40px #ff6b6b, 0 0 80px #ff6b6b;
            }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.08);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: #ff9999;
            padding: 1.5rem;
            border-radius: 0;
            font-size: 1rem;
            text-align: center;
            font-weight: 600;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #ff6b6b;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 0;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .team-color-primary {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="startOverlay">
        <h1>NBA Dashboard</h1>
        <p>Click to Start (Required for Audio)</p>
        <button class="start-button" id="startButton">Start App</button>
    </div>

    <div class="projector-container" id="mainApp" style="display: none;">
        <div class="black-bars"></div>
        
        <div class="projector-content">
            <div class="main-content">
                <!-- LEFT TEAM -->
                <div class="team-section" id="teamSectionLeft">
                    <div style="position: relative;">
                        <div class="team-header">
                            <div class="team-logo-large" id="teamLogoLeft">🏀</div>
                            <div class="team-name" id="teamNameLeft">Away</div>
                            <div class="team-score" id="teamScoreLeft">0</div>
                            <div class="team-record" id="teamRecordLeft">0-0</div>
                            <div class="game-status" id="gameStatusLeft">--</div>
                        </div>

                        <div class="video-section" id="videoSection">
                            <video id="videoFeed" playsinline></video>
                            <div class="video-controls">
                                <button class="video-btn" id="toggleCameraBtn">📷</button>
                                <button class="video-btn" id="toggleFullscreenVideoBtn">⛶</button>
                            </div>
                        </div>

                        <div class="stats-selector" id="statsSelectorLeft">
                            <button class="stat-btn active" data-type="team">Team Stats</button>
                            <button class="stat-btn" data-type="players">Players</button>
                        </div>
                    </div>

                    <div class="stats-content" id="statsContentLeft">
                        <div class="error-message">Loading...</div>
                    </div>
                </div>

                <!-- RIGHT TEAM -->
                <div class="team-section" id="teamSectionRight">
                    <div class="team-header">
                        <div class="team-logo-large" id="teamLogoRight">🏀</div>
                        <div class="team-name" id="teamNameRight">Home</div>
                        <div class="team-score" id="teamScoreRight">0</div>
                        <div class="team-record" id="teamRecordRight">0-0</div>
                        <div class="game-status" id="gameStatusRight">--</div>
                    </div>

                    <div class="stats-selector" id="statsSelectorRight">
                        <button class="stat-btn active" data-type="team">Team Stats</button>
                        <button class="stat-btn" data-type="players">Players</button>
                    </div>

                    <div class="stats-content" id="statsContentRight">
                        <div class="error-message">Loading...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="black-bars"></div>

        <div class="control-buttons">
            <button class="control-btn" id="fullscreenBtn">Fullscreen</button>
            <button class="control-btn" id="refreshBtn">Refresh</button>
        </div>
    </div>

    <script>
        // ============ NBA Team Colors ============
        const NBA_TEAM_COLORS = {
            'Atlanta Hawks': { primary: '#E03828', secondary: '#C4CED4' },
            'Boston Celtics': { primary: '#007A33', secondary: '#BA9653' },
            'Brooklyn Nets': { primary: '#000000', secondary: '#FFFFFF' },
            'Charlotte Hornets': { primary: '#1D1160', secondary: '#00778D' },
            'Chicago Bulls': { primary: '#CE1141', secondary: '#000000' },
            'Cleveland Cavaliers': { primary: '#6F2DA8', secondary: '#041E42' },
            'Dallas Mavericks': { primary: '#0C2340', secondary: '#B8C4CA' },
            'Denver Nuggets': { primary: '#0E2240', secondary: '#FFB81C' },
            'Detroit Pistons': { primary: '#C41E3A', secondary: '#1D428A' },
            'Golden State Warriors': { primary: '#1D428A', secondary: '#FFC72C' },
            'Houston Rockets': { primary: '#CE1141', secondary: '#000000' },
            'LA Clippers': { primary: '#C4CED4', secondary: '#ED174C' },
            'LA Lakers': { primary: '#552583', secondary: '#FDB927' },
            'Memphis Grizzlies': { primary: '#12120E', secondary: '#6189B9' },
            'Miami Heat': { primary: '#98002E', secondary: '#F9A01B' },
            'Milwaukee Bucks': { primary: '#12120E', secondary: '#00471B' },
            'Minnesota Timberwolves': { primary: '#0C2340', secondary: '#236B3D' },
            'New Orleans Pelicans': { primary: '#0C2340', secondary: '#C4CED4' },
            'New York Knicks': { primary: '#F58426', secondary: '#1D428A' },
            'Oklahoma City Thunder': { primary: '#002B5C', secondary: '#EF3B39' },
            'Orlando Magic': { primary: '#0077B6', secondary: '#000000' },
            'Philadelphia 76ers': { primary: '#1D1160', secondary: '#C4CED4' },
            'Phoenix Suns': { primary: '#1D1160', secondary: '#E56020' },
            'Portland Trail Blazers': { primary: '#E03828', secondary: '#000000' },
            'Sacramento Kings': { primary: '#5A2D81', secondary: '#63727A' },
            'San Antonio Spurs': { primary: '#C4CED4', secondary: '#000000' },
            'Toronto Raptors': { primary: '#CE1141', secondary: '#000000' },
            'Utah Jazz': { primary: '#002B5C', secondary: '#00471B' },
            'Washington Wizards': { primary: '#0C2340', secondary: '#E31937' }
        };

        // ============ Configuration ============
        const API_URL = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        // ============ State Management ============
        let appState = {
            currentGame: null,
            audioContext: null,
            isAppStarted: false,
            selectedPlayers: { left: null, right: null },
            statType: { left: 'team', right: 'team' },
            videoStream: null,
            teamColors: { left: { primary: '#0a0a0a', secondary: '#fff' }, right: { primary: '#0a0a0a', secondary: '#fff' } }
        };

        // ============ Utility Functions ============
        function getTeamColor(teamName) {
            return NBA_TEAM_COLORS[teamName] || { primary: '#0a0a0a', secondary: '#fff' };
        }

        function rgbToRgba(hex, alpha = 0.1) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // ============ Video Setup ============
        async function setupVideo() {
            try {
                const videoFeed = document.getElementById('videoFeed');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' },
                    audio: false 
                });
                appState.videoStream = stream;
                videoFeed.srcObject = stream;
                videoFeed.play();
            } catch (error) {
                console.warn('Camera access denied:', error);
                document.getElementById('videoSection').style.display = 'none';
            }
        }

        document.getElementById('toggleCameraBtn')?.addEventListener('click', async () => {
            if (appState.videoStream) {
                appState.videoStream.getTracks().forEach(track => track.stop());
                appState.videoStream = null;
                document.getElementById('videoFeed').srcObject = null;
            } else {
                await setupVideo();
            }
        });

        document.getElementById('toggleFullscreenVideoBtn')?.addEventListener('click', () => {
            const videoSection = document.getElementById('videoSection');
            if (!document.fullscreenElement) {
                videoSection.requestFullscreen().catch(err => console.warn('Fullscreen failed:', err));
            } else {
                document.exitFullscreen();
            }
        });

        // ============ Audio Setup ============
        function initAudioContext() {
            if (!appState.audioContext) {
                appState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (appState.audioContext.state === 'suspended') {
                appState.audioContext.resume();
            }
        }

        async function playSound(soundFile) {
            try {
                initAudioContext();
                const soundPath = `sounds/${soundFile}`;
                const response = await fetch(soundPath);
                if (!response.ok) return;
                const audioBuffer = await response.arrayBuffer();
                const buffer = await appState.audioContext.decodeAudioData(audioBuffer);
                const source = appState.audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(appState.audioContext.destination);
                source.start(0);
            } catch (error) {
                console.warn('Error playing sound:', error);
            }
        }

        function triggerTouchdown() {
            playSound('touchdown.mp3');
            const animation = document.createElement('div');
            animation.className = 'touchdown-animation';
            animation.textContent = 'SLAM!';
            document.body.appendChild(animation);
            setTimeout(() => animation.remove(), 1000);
        }

        function triggerDefense() {
            playSound('defense.mp3');
        }

        // ============ Keyboard Controls ============
        document.addEventListener('keydown', (event) => {
            if (!appState.isAppStarted) return;
            const key = event.key.toUpperCase();
            if (key === 'T') {
                triggerTouchdown();
            } else if (key === 'D') {
                triggerDefense();
            }
        });

        // ============ Start App ============
        document.getElementById('startButton').addEventListener('click', async () => {
            appState.isAppStarted = true;
            initAudioContext();
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            await setupVideo();
            fetchAndDisplayGame();
        });

        // ============ API Fetching ============
        async function fetchAndDisplayGame() {
            try {
                const proxiedUrl = CORS_PROXY + encodeURIComponent(API_URL);
                const response = await fetch(proxiedUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const game = data.events?.[0];
                
                if (!game) {
                    showError('No games found');
                    return;
                }

                appState.currentGame = game;
                renderGameData();
            } catch (error) {
                console.error('Error fetching game:', error);
                showError('Failed to load game data');
            }
        }

        function showError(message) {
            document.getElementById('statsContentLeft').innerHTML = `<div class="error-message">${message}</div>`;
            document.getElementById('statsContentRight').innerHTML = `<div class="error-message">${message}</div>`;
        }

        // ============ Rendering ============
        function renderGameData() {
            const game = appState.currentGame;
            if (!game) return;

            const competitors = game.competitions?.[0]?.competitors || [];
            const away = competitors.find(c => c.homeAway === 'away');
            const home = competitors.find(c => c.homeAway === 'home');

            if (!away || !home) {
                showError('Team data unavailable');
                return;
            }

            updateTeamSection('left', away, game);
            updateTeamSection('right', home, game);

            appState.teamColors.left = getTeamColor(away.team?.displayName || '');
            appState.teamColors.right = getTeamColor(home.team?.displayName || '');

            applyTeamColors();
            renderStats('left', away);
            renderStats('right', home);
        }

        function updateTeamSection(side, teamData, game) {
            const prefix = side === 'left' ? 'Left' : 'Right';
            const abbr = teamData.team?.abbreviation || '?';
            const name = teamData.team?.displayName?.split(' ').pop() || 'TEAM';
            const score = teamData.score || 0;
            const record = teamData.records?.[0]?.summary || '0-0';
            const status = game.competitions?.[0]?.status?.displayClock || '--';
            const period = game.competitions?.[0]?.status?.period || 0;

            document.getElementById(`teamLogo${prefix}`).textContent = abbr;
            document.getElementById(`teamName${prefix}`).textContent = name.toUpperCase();
            document.getElementById(`teamScore${prefix}`).textContent = score;
            document.getElementById(`teamRecord${prefix}`).textContent = record;
            document.getElementById(`gameStatus${prefix}`).textContent = `Q${period} • ${status}`;
        }

        function applyTeamColors() {
            const leftSection = document.getElementById('teamSectionLeft');
            const rightSection = document.getElementById('teamSectionRight');

            leftSection.style.background = rgbToRgba(appState.teamColors.left.primary, 0.04);
            rightSection.style.background = rgbToRgba(appState.teamColors.right.primary, 0.04);

            leftSection.style.borderLeftColor = appState.teamColors.left.primary;
            rightSection.style.borderRightColor = appState.teamColors.right.primary;
        }

        function renderStats(side, teamData) {
            const statType = appState.statType[side];
            if (statType === 'team') {
                renderTeamStats(side, teamData);
            } else {
                renderPlayerStats(side, teamData);
            }
        }

        function renderTeamStats(side, teamData) {
            const stats = teamData.statistics || [];
            const contentId = `statsContent${side === 'left' ? 'Left' : 'Right'}`;

            const points = stats.find(s => s.name === 'points')?.displayValue || '--';
            const rebounds = stats.find(s => s.name === 'rebounds')?.displayValue || '--';
            const assists = stats.find(s => s.name === 'assists')?.displayValue || '--';
            const steals = stats.find(s => s.name === 'steals')?.displayValue || '--';
            const blocks = stats.find(s => s.name === 'blocks')?.displayValue || '--';
            const turnovers = stats.find(s => s.name === 'turnovers')?.displayValue || '--';
            const fieldGoalsPct = stats.find(s => s.name === 'fieldGoalsPercentage')?.displayValue || '--';
            const threePointersPct = stats.find(s => s.name === 'threePointersPercentage')?.displayValue || '--';

            const statsHtml = `
                <div class="team-stats">
                    <div class="team-stat-row"><span class="stat-name">Points</span><span class="stat-number">${points}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Rebounds</span><span class="stat-number">${rebounds}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Assists</span><span class="stat-number">${assists}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Steals</span><span class="stat-number">${steals}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Blocks</span><span class="stat-number">${blocks}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Turnovers</span><span class="stat-number">${turnovers}</span></div>
                    <div class="team-stat-row"><span class="stat-name">FG %</span><span class="stat-number">${fieldGoalsPct}</span></div>
                    <div class="team-stat-row"><span class="stat-name">3PT %</span><span class="stat-number">${threePointersPct}</span></div>
                </div>
            `;
            document.getElementById(contentId).innerHTML = statsHtml;
        }

        function renderPlayerStats(side, teamData) {
            const contentId = `statsContent${side === 'left' ? 'Left' : 'Right'}`;
            const players = teamData.players || [];

            if (players.length === 0) {
                document.getElementById(contentId).innerHTML = '<div class="error-message">No player data available</div>';
                return;
            }

            let playersHtml = '';
            players.slice(0, 12).forEach(playerData => {
                const player = playerData.person || playerData;
                const selected = appState.selectedPlayers[side]?.id === player.id ? 'selected' : '';

                const points = playerData.stats?.find(s => s.name === 'points')?.displayValue || '0';
                const rebounds = playerData.stats?.find(s => s.name === 'rebounds')?.displayValue || '0';
                const assists = playerData.stats?.find(s => s.name === 'assists')?.displayValue || '0';
                const steals = playerData.stats?.find(s => s.name === 'steals')?.displayValue || '0';
                const blocks = playerData.stats?.find(s => s.name === 'blocks')?.displayValue || '0';
                const turnovers = playerData.stats?.find(s => s.name === 'turnovers')?.displayValue || '0';

                playersHtml += `
                    <div class="player-stats ${selected}" data-player-id="${player.id}" data-side="${side}">
                        <div class="player-header">
                            <div class="player-photo">${player.displayName?.charAt(0).toUpperCase() || '👤'}</div>
                            <div class="player-info">
                                <div class="player-name">${player.displayName?.toUpperCase() || 'PLAYER'}</div>
                                <div class="player-position">${playerData.position?.displayName || 'POS'}</div>
                                <div class="player-number">#${playerData.jerseyNumber || '--'}</div>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-value">${points}</div><div class="stat-label">Points</div></div>
                            <div class="stat-item"><div class="stat-value">${rebounds}</div><div class="stat-label">Reb</div></div>
                            <div class="stat-item"><div class="stat-value">${assists}</div><div class="stat-label">Ast</div></div>
                            <div class="stat-item"><div class="stat-value">${steals}</div><div class="stat-label">Stl</div></div>
                        </div>
                    </div>
                `;
            });

            document.getElementById(contentId).innerHTML = playersHtml;

            document.querySelectorAll(`[data-side="${side}"]`).forEach(el => {
                el.addEventListener('click', () => {
                    document.querySelectorAll(`[data-side="${side}"].selected`).forEach(s => s.classList.remove('selected'));
                    el.classList.add('selected');
                    appState.selectedPlayers[side] = {
                        id: el.dataset.playerId,
                        name: el.querySelector('.player-name').textContent
                    };
                });
            });
        }

        // ============ Event Listeners ============
        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchAndDisplayGame();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const mainApp = document.getElementById('mainApp');
            if (!document.fullscreenElement) {
                mainApp.requestFullscreen().catch(err => {
                    console.warn('Fullscreen request failed:', err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.querySelectorAll('.stat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const selector = e.target.closest('.stats-selector');
                const side = selector.id.includes('Left') ? 'left' : 'right';
                const type = e.target.dataset.type;

                appState.statType[side] = type;
                selector.querySelectorAll('.stat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const game = appState.currentGame;
                if (!game) return;

                const competitors = game.competitions?.[0]?.competitors || [];
                const teamData = side === 'left' ? competitors.find(c => c.homeAway === 'away') : competitors.find(c => c.homeAway === 'home');

                if (teamData) {
                    renderStats(side, teamData);
                }
            });
        });

        // ============ Auto-Refresh ============
        setInterval(() => {
            if (appState.isAppStarted) {
                fetchAndDisplayGame();
            }
        }, 30000);
    </script>
</body>
</html>
