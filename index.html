<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .projector-container {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        .projector-content {
            flex: 1;
            display: flex;
            width: 200vw;
            margin-left: -50vw;
        }

        .black-bars {
            background: #000;
            height: 60px;
        }

        .main-content {
            display: flex;
            flex: 1;
            width: 100%;
        }

        .team-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            position: relative;
            border-right: 3px solid #333;
        }

        .team-section:last-child {
            border-right: none;
        }

        .team-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .team-logo-large {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }

        .team-name {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-score {
            font-size: 4rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        .team-record {
            font-size: 1rem;
            color: #999;
        }

        .stats-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .stat-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }

        .stats-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 1rem;
        }

        .player-stats {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .player-stats:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .player-stats.selected {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .player-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .player-photo {
            width: 100px;
            height: 100px;
            border-radius: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            flex-shrink: 0;
            color: #666;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .player-position {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 0.5rem;
        }

        .player-number {
            font-size: 0.85rem;
            color: #666;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.75rem;
            border-radius: 0.375rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ade80;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.25rem;
        }

        .team-stats {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 1.5rem;
        }

        .team-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .team-stat-row:last-child {
            border-bottom: none;
        }

        .stat-name {
            font-size: 0.95rem;
            color: #ccc;
        }

        .stat-number {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4ade80;
        }

        .video-section {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 300px;
            height: 200px;
            background: #000;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-controls {
            position: absolute;
            bottom: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
            z-index: 10;
        }

        .video-btn {
            padding: 0.25rem 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.7rem;
            transition: background 0.2s;
        }

        .video-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 2rem;
        }

        .start-overlay.hidden {
            display: none;
        }

        .start-overlay h1 {
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-overlay p {
            font-size: 1.2rem;
            color: #888;
        }

        .start-button {
            padding: 1rem 3rem;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        .control-buttons {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
            z-index: 100;
        }

        .control-btn {
            padding: 0.75rem 1.5rem;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.95);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .sport-selector {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .sport-selector:hover {
            background: rgba(0, 0, 0, 0.95);
        }

        .touchdown-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            font-weight: bold;
            color: #ff6b6b;
            z-index: 999;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: touchdownPulse 1s ease-out;
            text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b;
        }

        @keyframes touchdownPulse {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8);
                text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b;
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
                text-shadow: 0 0 40px #ff6b6b, 0 0 80px #ff6b6b;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.2);
                text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b;
            }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 1rem;
            border-radius: 0.375rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #4ade80;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="startOverlay">
        <h1>Sports Dashboard</h1>
        <p>Click to Start (Required for Audio)</p>
        <button class="start-button" id="startButton">Start App</button>
    </div>

    <div class="projector-container" id="mainApp" style="display: none;">
        <div class="black-bars"></div>
        
        <div class="projector-content">
            <div class="main-content">
                <!-- LEFT TEAM -->
                <div class="team-section" id="teamSectionLeft">
                    <div style="position: relative;">
                        <div class="team-header">
                            <div class="team-logo-large" id="teamLogoLeft">🏈</div>
                            <div class="team-name" id="teamNameLeft">Away Team</div>
                            <div class="team-score" id="teamScoreLeft">0</div>
                            <div class="team-record" id="teamRecordLeft">0-0</div>
                            <div class="team-record" id="gameStatusLeft" style="margin-top: 0.5rem; font-size: 0.9rem;">--</div>
                        </div>

                        <div class="video-section" id="videoSection">
                            <video id="videoFeed" playsinline></video>
                            <div class="video-controls">
                                <button class="video-btn" id="toggleCameraBtn">📷</button>
                                <button class="video-btn" id="toggleFullscreenVideoBtn">⛶</button>
                            </div>
                        </div>

                        <div class="stats-selector" id="statsSelectorLeft">
                            <button class="stat-btn active" data-type="team">Team Stats</button>
                            <button class="stat-btn" data-type="players">Players</button>
                        </div>
                    </div>

                    <div class="stats-content" id="statsContentLeft">
                        <div class="error-message">Loading...</div>
                    </div>
                </div>

                <!-- RIGHT TEAM -->
                <div class="team-section" id="teamSectionRight">
                    <div class="team-header">
                        <div class="team-logo-large" id="teamLogoRight">🏈</div>
                        <div class="team-name" id="teamNameRight">Home Team</div>
                        <div class="team-score" id="teamScoreRight">0</div>
                        <div class="team-record" id="teamRecordRight">0-0</div>
                        <div class="team-record" id="gameStatusRight" style="margin-top: 0.5rem; font-size: 0.9rem;">--</div>
                    </div>

                    <div class="stats-selector" id="statsSelectorRight">
                        <button class="stat-btn active" data-type="team">Team Stats</button>
                        <button class="stat-btn" data-type="players">Players</button>
                    </div>

                    <div class="stats-content" id="statsContentRight">
                        <div class="error-message">Loading...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="black-bars"></div>

        <div class="control-buttons">
            <select id="sportSelector" class="sport-selector">
                <option value="nfl">🏈 NFL</option>
                <option value="nba">🏀 NBA</option>
                <option value="mlb">⚾ MLB</option>
            </select>
            <button class="control-btn" id="fullscreenBtn">Fullscreen</button>
            <button class="control-btn" id="refreshBtn">Refresh</button>
        </div>
    </div>

    <script>
        // ============ Configuration ============
        const API_ENDPOINTS = {
            nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
            nba: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
            mlb: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard'
        };

        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        // ============ State Management ============
        let appState = {
            currentSport: 'nfl',
            currentGame: null,
            audioContext: null,
            isAppStarted: false,
            selectedPlayers: { left: null, right: null },
            statType: { left: 'team', right: 'team' },
            videoStream: null,
            teamColors: {
                left: '#1a1a2e',
                right: '#1a1a2e'
            }
        };

        // ============ Utility Functions ============
        function getTeamColor(teamName) {
            const colors = {
                'Kansas City Chiefs': '#E31828',
                'San Francisco 49ers': '#AA0000',
                'Philadelphia Eagles': '#003831',
                'Dallas Cowboys': '#003594',
                'Buffalo Bills': '#00338D',
                'Green Bay Packers': '#203731',
                'New England Patriots': '#002244',
                'Pittsburgh Steelers': '#27251F',
                'Los Angeles Rams': '#003594',
                'Tampa Bay Buccaneers': '#FF6B35',
                'Miami Dolphins': '#008E97',
                'New York Giants': '#0B3A7D',
                'Chicago Bears': '#0B162A',
                'New Orleans Saints': '#D3BC8D',
                'Las Vegas Raiders': '#000000',
                'Atlanta Falcons': '#A71930',
                'Baltimore Ravens': '#241773',
                'New York Jets': '#125740',
                'Denver Broncos': '#FB4F14',
                'Tennessee Titans': '#0C2C56',
                'Minnesota Vikings': '#4F2683',
                'Washington Football Team': '#5A1D34',
                'Arizona Cardinals': '#97233F',
                'Seattle Seahawks': '#0C2C56',
                'Jacksonville Jaguars': '#006687',
                'Houston Texans': '#03202F',
                'Los Angeles Chargers': '#0080B4',
                'Cincinnati Bengals': '#FB4F14',
                'Indianapolis Colts': '#002C5F',
                'Detroit Lions': '#0076B6',
                'Carolina Panthers': '#0085CA',
            };
            return colors[teamName] || '#1a1a2e';
        }

        function rgbToRgba(hex, alpha = 0.1) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // ============ Video Setup ============
        async function setupVideo() {
            try {
                const videoFeed = document.getElementById('videoFeed');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' },
                    audio: false 
                });
                appState.videoStream = stream;
                videoFeed.srcObject = stream;
                videoFeed.play();
            } catch (error) {
                console.warn('Camera access denied or unavailable:', error);
                document.getElementById('videoSection').style.display = 'none';
            }
        }

        document.getElementById('toggleCameraBtn')?.addEventListener('click', async () => {
            if (appState.videoStream) {
                appState.videoStream.getTracks().forEach(track => track.stop());
                appState.videoStream = null;
                document.getElementById('videoFeed').srcObject = null;
            } else {
                await setupVideo();
            }
        });

        document.getElementById('toggleFullscreenVideoBtn')?.addEventListener('click', () => {
            const videoSection = document.getElementById('videoSection');
            if (!document.fullscreenElement) {
                videoSection.requestFullscreen().catch(err => console.warn('Fullscreen failed:', err));
            } else {
                document.exitFullscreen();
            }
        });

        // ============ Audio Setup ============
        function initAudioContext() {
            if (!appState.audioContext) {
                appState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (appState.audioContext.state === 'suspended') {
                appState.audioContext.resume();
            }
        }

        async function playSound(soundFile) {
            try {
                initAudioContext();
                const soundPath = `sounds/${soundFile}`;
                const response = await fetch(soundPath);
                if (!response.ok) return;
                const audioBuffer = await response.arrayBuffer();
                const buffer = await appState.audioContext.decodeAudioData(audioBuffer);
                const source = appState.audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(appState.audioContext.destination);
                source.start(0);
            } catch (error) {
                console.warn('Error playing sound:', error);
            }
        }

        function triggerTouchdown() {
            playSound('touchdown.mp3');
            const animation = document.createElement('div');
            animation.className = 'touchdown-animation';
            animation.textContent = 'TOUCHDOWN!';
            document.body.appendChild(animation);
            setTimeout(() => animation.remove(), 1000);
        }

        function triggerDefense() {
            playSound('defense.mp3');
        }

        // ============ Keyboard Controls ============
        document.addEventListener('keydown', (event) => {
            if (!appState.isAppStarted) return;
            const key = event.key.toUpperCase();
            if (key === 'T') {
                triggerTouchdown();
            } else if (key === 'D') {
                triggerDefense();
            }
        });

        // ============ Start App ============
        document.getElementById('startButton').addEventListener('click', async () => {
            appState.isAppStarted = true;
            initAudioContext();
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            await setupVideo();
            fetchAndDisplayGame();
        });

        // ============ API Fetching ============
        async function fetchAndDisplayGame() {
            try {
                const url = API_ENDPOINTS[appState.currentSport];
                const proxiedUrl = CORS_PROXY + encodeURIComponent(url);

                const response = await fetch(proxiedUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const game = data.events?.[0];
                
                if (!game) {
                    showError('No games found');
                    return;
                }

                appState.currentGame = game;
                renderGameData();
            } catch (error) {
                console.error('Error fetching game:', error);
                showError('Failed to load game data');
            }
        }

        function showError(message) {
            document.getElementById('statsContentLeft').innerHTML = `<div class="error-message">${message}</div>`;
            document.getElementById('statsContentRight').innerHTML = `<div class="error-message">${message}</div>`;
        }

        // ============ Rendering ============
        function renderGameData() {
            const game = appState.currentGame;
            if (!game) return;

            const competitors = game.competitions?.[0]?.competitors || [];
            const away = competitors.find(c => c.homeAway === 'away');
            const home = competitors.find(c => c.homeAway === 'home');

            if (!away || !home) {
                showError('Team data unavailable');
                return;
            }

            // Update team info
            updateTeamSection('left', away, game);
            updateTeamSection('right', home, game);

            // Set team colors
            appState.teamColors.left = getTeamColor(away.team?.displayName || '');
            appState.teamColors.right = getTeamColor(home.team?.displayName || '');

            applyTeamColors();

            // Render initial stats
            renderStats('left', away);
            renderStats('right', home);
        }

        function updateTeamSection(side, teamData, game) {
            const sectionId = `teamSection${side === 'left' ? 'Left' : 'Right'}`;
            const section = document.getElementById(sectionId);
            const logoId = `teamLogo${side === 'left' ? 'Left' : 'Right'}`;
            const nameId = `teamName${side === 'left' ? 'Left' : 'Right'}`;
            const scoreId = `teamScore${side === 'left' ? 'Left' : 'Right'}`;
            const recordId = `teamRecord${side === 'left' ? 'Left' : 'Right'}`;
            const statusId = `gameStatus${side === 'left' ? 'Left' : 'Right'}`;

            const abbr = teamData.team?.abbreviation || '?';
            const name = teamData.team?.displayName || 'Team';
            const score = teamData.score || 0;
            const record = teamData.records?.[0]?.summary || '0-0';
            const status = game.competitions?.[0]?.status?.displayClock || '--';

            document.getElementById(logoId).textContent = abbr;
            document.getElementById(nameId).textContent = name;
            document.getElementById(scoreId).textContent = score;
            document.getElementById(recordId).textContent = record;
            document.getElementById(statusId).textContent = status;
        }

        function applyTeamColors() {
            const leftSection = document.getElementById('teamSectionLeft');
            const rightSection = document.getElementById('teamSectionRight');

            leftSection.style.background = rgbToRgba(appState.teamColors.left, 0.08);
            rightSection.style.background = rgbToRgba(appState.teamColors.right, 0.08);
        }

        function renderStats(side, teamData) {
            const statType = appState.statType[side];
            const contentId = `statsContent${side === 'left' ? 'Left' : 'Right'}`;

            if (statType === 'team') {
                renderTeamStats(side, teamData);
            } else {
                renderPlayerStats(side, teamData);
            }
        }

        function renderTeamStats(side, teamData) {
            const stats = teamData.statistics || [];
            const contentId = `statsContent${side === 'left' ? 'Left' : 'Right'}`;

            let statsHtml = '<div class="team-stats">';

            if (appState.currentSport === 'nfl') {
                const passingYards = stats.find(s => s.name === 'passingYards')?.displayValue || '--';
                const rushingYards = stats.find(s => s.name === 'rushingYards')?.displayValue || '--';
                const turnovers = stats.find(s => s.name === 'turnovers')?.displayValue || '--';
                const tackles = stats.find(s => s.name === 'tackles')?.displayValue || '--';
                const interceptions = stats.find(s => s.name === 'interceptions')?.displayValue || '--';
                const sacks = stats.find(s => s.name === 'sacks')?.displayValue || '--';

                statsHtml += `
                    <div class="team-stat-row"><span class="stat-name">Passing Yards</span><span class="stat-number">${passingYards}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Rushing Yards</span><span class="stat-number">${rushingYards}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Turnovers</span><span class="stat-number">${turnovers}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Tackles</span><span class="stat-number">${tackles}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Interceptions</span><span class="stat-number">${interceptions}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Sacks</span><span class="stat-number">${sacks}</span></div>
                `;
            } else if (appState.currentSport === 'nba') {
                const points = stats.find(s => s.name === 'points')?.displayValue || '--';
                const rebounds = stats.find(s => s.name === 'rebounds')?.displayValue || '--';
                const assists = stats.find(s => s.name === 'assists')?.displayValue || '--';
                const steals = stats.find(s => s.name === 'steals')?.displayValue || '--';
                const blocks = stats.find(s => s.name === 'blocks')?.displayValue || '--';
                const turnovers = stats.find(s => s.name === 'turnovers')?.displayValue || '--';

                statsHtml += `
                    <div class="team-stat-row"><span class="stat-name">Points</span><span class="stat-number">${points}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Rebounds</span><span class="stat-number">${rebounds}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Assists</span><span class="stat-number">${assists}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Steals</span><span class="stat-number">${steals}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Blocks</span><span class="stat-number">${blocks}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Turnovers</span><span class="stat-number">${turnovers}</span></div>
                `;
            } else if (appState.currentSport === 'mlb') {
                const hits = stats.find(s => s.name === 'hits')?.displayValue || '--';
                const runs = stats.find(s => s.name === 'runs')?.displayValue || '--';
                const rbi = stats.find(s => s.name === 'rbi')?.displayValue || '--';
                const strikeouts = stats.find(s => s.name === 'strikeouts')?.displayValue || '--';
                const errors = stats.find(s => s.name === 'errors')?.displayValue || '--';

                statsHtml += `
                    <div class="team-stat-row"><span class="stat-name">Hits</span><span class="stat-number">${hits}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Runs</span><span class="stat-number">${runs}</span></div>
                    <div class="team-stat-row"><span class="stat-name">RBIs</span><span class="stat-number">${rbi}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Strikeouts</span><span class="stat-number">${strikeouts}</span></div>
                    <div class="team-stat-row"><span class="stat-name">Errors</span><span class="stat-number">${errors}</span></div>
                `;
            }

            statsHtml += '</div>';
            document.getElementById(contentId).innerHTML = statsHtml;
        }

        function renderPlayerStats(side, teamData) {
            const contentId = `statsContent${side === 'left' ? 'Left' : 'Right'}`;
            const players = teamData.players || [];

            if (players.length === 0) {
                document.getElementById(contentId).innerHTML = '<div class="error-message">No player data available</div>';
                return;
            }

            let playersHtml = '';
            players.slice(0, 10).forEach(playerData => {
                const player = playerData.person || playerData;
                const selected = appState.selectedPlayers[side]?.id === player.id ? 'selected' : '';

                const statsGrid = getPlayerStatsGrid(playerData);

                playersHtml += `
                    <div class="player-stats ${selected}" data-player-id="${player.id}" data-side="${side}">
                        <div class="player-header">
                            <div class="player-photo">${player.displayName?.charAt(0) || '👤'}</div>
                            <div class="player-info">
                                <div class="player-name">${player.displayName || 'Player'}</div>
                                <div class="player-position">${playerData.position?.displayName || 'Position TBD'}</div>
                                <div class="player-number">#${playerData.jerseyNumber || '--'}</div>
                            </div>
                        </div>
                        <div class="stats-grid">
                            ${statsGrid}
                        </div>
                    </div>
                `;
            });

            document.getElementById(contentId).innerHTML = playersHtml;

            // Add click handlers
            document.querySelectorAll(`[data-side="${side}"]`).forEach(el => {
                el.addEventListener('click', () => {
                    document.querySelectorAll(`[data-side="${side}"].selected`).forEach(s => s.classList.remove('selected'));
                    el.classList.add('selected');
                    appState.selectedPlayers[side] = {
                        id: el.dataset.playerId,
                        name: el.querySelector('.player-name').textContent
                    };
                });
            });
        }

        function getPlayerStatsGrid(playerData) {
            const stats = playerData.stats || [];

            if (appState.currentSport === 'nfl') {
                const passing = stats.find(s => s.name === 'passing') || {};
                const rushing = stats.find(s => s.name === 'rushing') || {};
                const receiving = stats.find(s => s.name === 'receiving') || {};

                return `
                    <div class="stat-item"><div class="stat-value">${passing.statistics?.[0]?.displayValue || '--'}</div><div class="stat-label">Pass Yds</div></div>
                    <div class="stat-item"><div class="stat-value">${rushing.statistics?.[0]?.displayValue || '--'}</div><div class="stat-label">Rush Yds</div></div>
                    <div class="stat-item"><div class="stat-value">${receiving.statistics?.[0]?.displayValue || '--'}</div><div class="stat-label">Rec Yds</div></div>
                    <div class="stat-item"><div class="stat-value">${passing.statistics?.[2]?.displayValue || '--'}</div><div class="stat-label">TDs</div></div>
                `;
            } else if (appState.currentSport === 'nba') {
                const points = stats.find(s => s.name === 'points')?.displayValue || '--';
                const rebounds = stats.find(s => s.name === 'rebounds')?.displayValue || '--';
                const assists = stats.find(s => s.name === 'assists')?.displayValue || '--';
                const steals = stats.find(s => s.name === 'steals')?.displayValue || '--';

                return `
                    <div class="stat-item"><div class="stat-value">${points}</div><div class="stat-label">Points</div></div>
                    <div class="stat-item"><div class="stat-value">${rebounds}</div><div class="stat-label">Rebounds</div></div>
                    <div class="stat-item"><div class="stat-value">${assists}</div><div class="stat-label">Assists</div></div>
                    <div class="stat-item"><div class="stat-value">${steals}</div><div class="stat-label">Steals</div></div>
                `;
            } else if (appState.currentSport === 'mlb') {
                const hits = stats.find(s => s.name === 'hits')?.displayValue || '--';
                const runs = stats.find(s => s.name === 'runs')?.displayValue || '--';
                const rbi = stats.find(s => s.name === 'rbi')?.displayValue || '--';
                const homeRuns = stats.find(s => s.name === 'homeRuns')?.displayValue || '--';

                return `
                    <div class="stat-item"><div class="stat-value">${hits}</div><div class="stat-label">Hits</div></div>
                    <div class="stat-item"><div class="stat-value">${runs}</div><div class="stat-label">Runs</div></div>
                    <div class="stat-item"><div class="stat-value">${rbi}</div><div class="stat-label">RBIs</div></div>
                    <div class="stat-item"><div class="stat-value">${homeRuns}</div><div class="stat-label">HRs</div></div>
                `;
            }

            return '';
        }

        // ============ Event Listeners ============
        document.getElementById('sportSelector').addEventListener('change', (e) => {
            appState.currentSport = e.target.value;
            appState.selectedPlayers = { left: null, right: null };
            fetchAndDisplayGame();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchAndDisplayGame();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const mainApp = document.getElementById('mainApp');
            if (!document.fullscreenElement) {
                mainApp.requestFullscreen().catch(err => {
                    console.warn('Fullscreen request failed:', err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Stats selector buttons
        document.querySelectorAll('.stat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const selector = e.target.closest('.stats-selector');
                const side = selector.id.includes('Left') ? 'left' : 'right';
                const type = e.target.dataset.type;

                appState.statType[side] = type;

                selector.querySelectorAll('.stat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const game = appState.currentGame;
                if (!game) return;

                const competitors = game.competitions?.[0]?.competitors || [];
                const teamData = side === 'left' ? competitors.find(c => c.homeAway === 'away') : competitors.find(c => c.homeAway === 'home');

                if (teamData) {
                    renderStats(side, teamData);
                }
            });
        });

        // ============ Auto-Refresh ============
        setInterval(() => {
            if (appState.isAppStarted) {
                fetchAndDisplayGame();
            }
        }, 30000); // 30 seconds
    </script>
</body>
</html>
