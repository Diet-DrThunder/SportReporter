<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatBars - NBA Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #000;
            padding: 1.5rem;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #4ade80;
        }

        .game-selector {
            flex: 1;
            margin: 0 2rem;
        }

        .game-selector select {
            width: 100%;
            max-width: 400px;
            padding: 0.7rem 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-selector select:hover {
            border-color: #555;
            background: #252525;
        }

        .game-selector select:focus {
            outline: none;
            border-color: #4ade80;
            background: #252525;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            gap: 0;
        }

        /* Theatre Mode Layout */
        .stats-panel {
            width: 25%;
            display: flex;
            flex-direction: column;
            background: #0f0f0f;
            border-right: 2px solid #222;
            overflow: hidden;
        }

        .stats-panel.right {
            border-right: none;
            border-left: 2px solid #222;
        }

        .center-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
        }

        .broadcast-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .broadcast-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }

        .broadcast-placeholder svg {
            width: 120px;
            height: 120px;
            opacity: 0.3;
        }

        .broadcast-placeholder p {
            color: #666;
            font-size: 1.1rem;
        }

        .game-info-bar {
            background: #1a1a1a;
            border-top: 1px solid #222;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .team-scoreline {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex: 1;
        }

        .team-score {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .team-name {
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-large {
            font-size: 2.5rem;
            font-weight: bold;
            min-width: 80px;
        }

        .game-time-center {
            text-align: center;
            flex: 1;
        }

        .game-time-center .status {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-time-center .time {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4ade80;
        }

        .panel-header {
            background: linear-gradient(to bottom, #1a1a1a, #0f0f0f);
            padding: 1.5rem;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        .panel-team-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .panel-team-logo {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .panel-team-name {
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .panel-team-record {
            font-size: 0.85rem;
            color: #888;
        }

        .view-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .view-btn {
            flex: 1;
            padding: 0.6rem;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 3px;
        }

        .view-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .view-btn.active {
            background: #333;
            border-color: #555;
            color: #4ade80;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .stat-row {
            display: flex;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #1a1a1a;
            gap: 1rem;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #888;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.7rem;
            min-width: 60px;
        }

        .stat-value-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-bar-container {
            flex: 1;
            height: 24px;
            background: #1a1a1a;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 0.5rem;
        }

        .stat-bar-text {
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4ade80;
            min-width: 45px;
            text-align: right;
        }

        .player-card {
            background: #1a1a1a;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-left: 3px solid #333;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 3px;
        }

        .player-card:hover {
            background: #252525;
            border-left-color: #555;
        }

        .player-name {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.6rem;
        }

        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
        }

        .player-stat {
            background: rgba(74, 222, 128, 0.1);
            padding: 0.4rem;
            border-radius: 3px;
            text-align: center;
            font-size: 0.7rem;
        }

        .player-stat-value {
            font-weight: bold;
            font-size: 0.9rem;
            color: #4ade80;
        }

        .player-stat-label {
            color: #888;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 2rem 1rem;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #dc2626;
            color: #fca5a5;
            padding: 1rem;
            border-radius: 4px;
            text-align: center;
            margin: 1rem;
        }

        .game-selector-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 2rem;
        }

        .game-selector-overlay.hidden {
            display: none;
        }

        .selector-content h1 {
            font-size: 3.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #4ade80;
            margin-bottom: 1rem;
        }

        .selector-content p {
            font-size: 1rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .game-options {
            display: flex;
            gap: 2rem;
            width: 100%;
            justify-content: center;
        }

        .game-option {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            flex: 0 1 400px;
        }

        .game-option:hover {
            border-color: #4ade80;
            background: #252525;
            transform: translateY(-2px);
        }

        .game-option-matchup {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .game-option-status {
            font-size: 0.9rem;
            color: #888;
        }

        .test-button {
            padding: 1rem 2rem;
            background: #dc2626;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .test-button:hover {
            background: #b91c1c;
            transform: scale(1.05);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <!-- Game Selection Overlay -->
    <div class="game-selector-overlay" id="gameSelector">
        <div class="selector-content">
            <h1>StatBars</h1>
            <p>Select a game to begin</p>
            <div class="game-options">
                <div id="liveGamesContainer"></div>
                <button class="test-button" id="testModeBtn">TEST MODE</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="container" id="mainApp" style="display: none;">
        <!-- Header -->
        <div class="header">
            <div class="header-title">StatBars</div>
            <div class="game-selector">
                <select id="gameDropdown">
                    <option value="">Select Game</option>
                </select>
            </div>
            <div class="controls">
                <button class="btn" id="refreshBtn">Refresh</button>
                <button class="btn" id="homeBtn">Home</button>
                <button class="btn" id="fullscreenBtn">Fullscreen</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- LEFT STATS PANEL -->
            <div class="stats-panel left" id="leftPanel">
                <div class="panel-header">
                    <div class="panel-team-info">
                        <div class="panel-team-logo" id="leftTeamLogo">🏀</div>
                        <div>
                            <div class="panel-team-name" id="leftTeamName">Team</div>
                            <div class="panel-team-record" id="leftTeamRecord">0-0</div>
                        </div>
                    </div>
                    <div class="view-buttons">
                        <button class="view-btn active" data-panel="left" data-view="team">Team</button>
                        <button class="view-btn" data-panel="left" data-view="players">Players</button>
                    </div>
                </div>
                <div class="panel-content" id="leftContent">
                    <div class="loading">Loading stats...</div>
                </div>
            </div>

            <!-- CENTER BROADCAST -->
            <div class="center-section">
                <div class="broadcast-container">
                    <div class="broadcast-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                            <polyline points="17 2 12 7 7 2"></polyline>
                        </svg>
                        <p>Broadcast Video Here</p>
                    </div>
                </div>
                <div class="game-info-bar">
                    <div class="team-scoreline">
                        <div class="team-score">
                            <div>
                                <div class="team-name" id="leftTeamNameScore">Away</div>
                                <div class="score-large" id="leftScoreMain">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="game-time-center">
                        <div class="status" id="gameStatus">--</div>
                        <div class="time" id="gameTimeMain">--</div>
                    </div>
                    <div class="team-scoreline" style="flex-direction: row-reverse;">
                        <div class="team-score">
                            <div>
                                <div class="team-name" id="rightTeamNameScore">Home</div>
                                <div class="score-large" id="rightScoreMain">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT STATS PANEL -->
            <div class="stats-panel right" id="rightPanel">
                <div class="panel-header">
                    <div class="panel-team-info">
                        <div class="panel-team-logo" id="rightTeamLogo">🏀</div>
                        <div>
                            <div class="panel-team-name" id="rightTeamName">Team</div>
                            <div class="panel-team-record" id="rightTeamRecord">0-0</div>
                        </div>
                    </div>
                    <div class="view-buttons">
                        <button class="view-btn active" data-panel="right" data-view="team">Team</button>
                        <button class="view-btn" data-panel="right" data-view="players">Players</button>
                    </div>
                </div>
                <div class="panel-content" id="rightContent">
                    <div class="loading">Loading stats...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        const NBA_API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';

        const TEAM_COLORS = {
            'LAL': { primary: '#552583', secondary: '#FDB927' },
            'BOS': { primary: '#007A33', secondary: '#BA9653' },
            'GSW': { primary: '#1D428A', secondary: '#FFC72C' },
            'MIA': { primary: '#98002E', secondary: '#F9A01B' },
            'NYK': { primary: '#0C2340', secondary: '#F58426' },
            'CHI': { primary: '#CE1141', secondary: '#000000' },
            'DAL': { primary: '#003DA5', secondary: '#B8C4CA' },
            'SAS': { primary: '#C4CED4', secondary: '#000000' },
            'OKC': { primary: '#007AC1', secondary: '#EF3B39' },
            'DEN': { primary: '#0E2240', secondary: '#FFB81C' },
            'PHX': { primary: '#E56021', secondary: '#1D1160' },
            'LAC': { primary: '#C60C30', secondary: '#1D428A' },
            'MEM': { primary: '#12173F', secondary: '#FDB827' },
            'NOP': { primary: '#0C2C56', secondary: '#C4CED4' },
            'MIN': { primary: '#0C2340', secondary: '#236B8E' },
            'MIL': { primary: '#12173F', secondary: '#EEE1AA' },
            'TOR': { primary: '#CE1141', secondary: '#000000' },
            'PHI': { primary: '#1D428A', secondary: '#C4CED4' },
            'ATL': { primary: '#E03828', secondary: '#061922' },
            'BKN': { primary: '#000000', secondary: '#FFFFFF' },
            'CLE': { primary: '#6F2DA8', secondary: '#041E42' },
            'DET': { primary: '#C8102E', secondary: '#1D42BA' },
            'HOU': { primary: '#CE1141', secondary: '#000000' },
            'IND': { primary: '#002D62', secondary: '#FDBB2F' },
            'ORL': { primary: '#0072CE', secondary: '#C41E3A' },
            'SAC': { primary: '#5A2D81', secondary: '#63727A' },
            'UTA': { primary: '#F9A01B', secondary: '#00471B' },
            'POR': { primary: '#E03828', secondary: '#000000' },
            'CHO': { primary: '#00778D', secondary: '#1BA1D7' },
            'WAS': { primary: '#002B5C', secondary: '#F0163F' }
        };

        const NBA_TEAMS = [
            { name: 'Los Angeles Lakers', abbr: 'LAL' },
            { name: 'Boston Celtics', abbr: 'BOS' },
            { name: 'Golden State Warriors', abbr: 'GSW' },
            { name: 'Miami Heat', abbr: 'MIA' },
            { name: 'New York Knicks', abbr: 'NYK' },
            { name: 'Chicago Bulls', abbr: 'CHI' },
            { name: 'Dallas Mavericks', abbr: 'DAL' },
            { name: 'San Antonio Spurs', abbr: 'SAS' },
            { name: 'Oklahoma City Thunder', abbr: 'OKC' },
            { name: 'Denver Nuggets', abbr: 'DEN' },
            { name: 'Phoenix Suns', abbr: 'PHX' },
            { name: 'Los Angeles Clippers', abbr: 'LAC' },
            { name: 'Memphis Grizzlies', abbr: 'MEM' },
            { name: 'New Orleans Pelicans', abbr: 'NOP' },
            { name: 'Minnesota Timberwolves', abbr: 'MIN' },
            { name: 'Milwaukee Bucks', abbr: 'MIL' },
            { name: 'Toronto Raptors', abbr: 'TOR' },
            { name: 'Philadelphia 76ers', abbr: 'PHI' },
            { name: 'Atlanta Hawks', abbr: 'ATL' },
            { name: 'Brooklyn Nets', abbr: 'BKN' },
            { name: 'Cleveland Cavaliers', abbr: 'CLE' },
            { name: 'Detroit Pistons', abbr: 'DET' },
            { name: 'Houston Rockets', abbr: 'HOU' },
            { name: 'Indiana Pacers', abbr: 'IND' },
            { name: 'Orlando Magic', abbr: 'ORL' },
            { name: 'Sacramento Kings', abbr: 'SAC' },
            { name: 'Utah Jazz', abbr: 'UTA' },
            { name: 'Portland Trail Blazers', abbr: 'POR' },
            { name: 'Charlotte Hornets', abbr: 'CHO' },
            { name: 'Washington Wizards', abbr: 'WAS' }
        ];

        let appState = {
            allGames: [],
            currentGame: null,
            currentGameId: null,
            isStarted: false,
            isTestMode: false,
            viewMode: { left: 'team', right: 'team' },
            refreshInterval: null
        };

        function getRandomTeam() {
            return NBA_TEAMS[Math.floor(Math.random() * NBA_TEAMS.length)];
        }

        function getRandomStats() {
            return {
                'fieldGoalPct': Math.floor(Math.random() * 40) + 40,
                'threePointPct': Math.floor(Math.random() * 40) + 20,
                'freeThrowPct': Math.floor(Math.random() * 30) + 70,
                'points': Math.floor(Math.random() * 60) + 80,
                'rebounds': Math.floor(Math.random() * 20) + 40,
                'assists': Math.floor(Math.random() * 20) + 20,
                'steals': Math.floor(Math.random() * 10) + 5,
                'blocks': Math.floor(Math.random() * 10) + 4,
                'turnovers': Math.floor(Math.random() * 15) + 10,
                'personalFouls': Math.floor(Math.random() * 10) + 15
            };
        }

        function generateTestGame() {
            const awayTeam = getRandomTeam();
            let homeTeam = getRandomTeam();
            while (homeTeam.abbr === awayTeam.abbr) {
                homeTeam = getRandomTeam();
            }

            return {
                id: 'test-game',
                competitions: [{
                    id: 'test',
                    clock: 1800,
                    period: 2,
                    status: { type: { description: 'In Progress' } },
                    competitors: [
                        {
                            homeAway: 'away',
                            score: Math.floor(Math.random() * 60) + 80,
                            team: { displayName: awayTeam.name, abbreviation: awayTeam.abbr },
                            records: [{ summary: '25-10' }],
                            statistics: [
                                { name: 'fieldGoalPct', displayValue: getRandomStats().fieldGoalPct },
                                { name: 'threePointPct', displayValue: getRandomStats().threePointPct },
                                { name: 'freeThrowPct', displayValue: getRandomStats().freeThrowPct },
                                { name: 'points', displayValue: getRandomStats().points },
                                { name: 'rebounds', displayValue: getRandomStats().rebounds },
                                { name: 'assists', displayValue: getRandomStats().assists },
                                { name: 'steals', displayValue: getRandomStats().steals },
                                { name: 'blocks', displayValue: getRandomStats().blocks },
                                { name: 'turnovers', displayValue: getRandomStats().turnovers },
                                { name: 'personalFouls', displayValue: getRandomStats().personalFouls }
                            ],
                            players: []
                        },
                        {
                            homeAway: 'home',
                            score: Math.floor(Math.random() * 60) + 80,
                            team: { displayName: homeTeam.name, abbreviation: homeTeam.abbr },
                            records: [{ summary: '28-8' }],
                            statistics: [
                                { name: 'fieldGoalPct', displayValue: getRandomStats().fieldGoalPct },
                                { name: 'threePointPct', displayValue: getRandomStats().threePointPct },
                                { name: 'freeThrowPct', displayValue: getRandomStats().freeThrowPct },
                                { name: 'points', displayValue: getRandomStats().points },
                                { name: 'rebounds', displayValue: getRandomStats().rebounds },
                                { name: 'assists', displayValue: getRandomStats().assists },
                                { name: 'steals', displayValue: getRandomStats().steals },
                                { name: 'blocks', displayValue: getRandomStats().blocks },
                                { name: 'turnovers', displayValue: getRandomStats().turnovers },
                                { name: 'personalFouls', displayValue: getRandomStats().personalFouls }
                            ],
                            players: []
                        }
                    ]
                }]
            };
        }

        // ============ Load Games on Start ============
        async function loadAvailableGames() {
            try {
                const url = CORS_PROXY + encodeURIComponent(NBA_API);
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch');
                
                const data = await response.json();
                appState.allGames = data.events || [];
                
                renderGameSelector();
            } catch (error) {
                console.error('Error:', error);
                const container = document.getElementById('liveGamesContainer');
                container.innerHTML = '<div class="error">Failed to load live games</div>';
            }
        }

        function renderGameSelector() {
            const container = document.getElementById('liveGamesContainer');
            container.innerHTML = '';

            if (appState.allGames.length === 0) {
                container.innerHTML = '<div class="error">No games available right now</div>';
                return;
            }

            appState.allGames.slice(0, 2).forEach((game, index) => {
                const competitors = game.competitions?.[0]?.competitors || [];
                const away = competitors.find(c => c.homeAway === 'away');
                const home = competitors.find(c => c.homeAway === 'home');
                const status = game.competitions?.[0]?.status?.type?.description || 'Scheduled';

                if (!away || !home) return;

                const option = document.createElement('div');
                option.className = 'game-option';
                option.innerHTML = `
                    <div class="game-option-matchup">${away.team.displayName} @ ${home.team.displayName}</div>
                    <div class="game-option-status">${status}</div>
                `;
                option.addEventListener('click', () => selectGame(index));
                container.appendChild(option);
            });
        }

        function selectGame(gameIndex) {
            appState.currentGame = appState.allGames[gameIndex];
            appState.currentGameId = appState.currentGame.id;
            appState.isStarted = true;
            appState.isTestMode = false;

            document.getElementById('gameSelector').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';

            populateGameDropdown();
            renderGame();
            startAutoRefresh();
        }

        document.getElementById('testModeBtn').addEventListener('click', () => {
            appState.currentGame = generateTestGame();
            appState.currentGameId = 'test-game';
            appState.isStarted = true;
            appState.isTestMode = true;

            document.getElementById('gameSelector').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';

            renderGame();
        });

        function populateGameDropdown() {
            const dropdown = document.getElementById('gameDropdown');
            dropdown.innerHTML = '';

            appState.allGames.forEach((game, index) => {
                const competitors = game.competitions?.[0]?.competitors || [];
                const away = competitors.find(c => c.homeAway === 'away');
                const home = competitors.find(c => c.homeAway === 'home');

                if (!away || !home) return;

                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${away.team.displayName} @ ${home.team.displayName}`;
                if (game.id === appState.currentGameId) option.selected = true;
                dropdown.appendChild(option);
            });

            dropdown.addEventListener('change', (e) => {
                selectGame(parseInt(e.target.value));
            });
        }

        function getTeamColor(abbr, type = 'primary') {
            return TEAM_COLORS[abbr]?.[type] || '#4ade80';
        }

        // ============ Render Game ============
        function renderGame() {
            const game = appState.currentGame;
            const competitors = game.competitions?.[0]?.competitors || [];
            const away = competitors.find(c => c.homeAway === 'away');
            const home = competitors.find(c => c.homeAway === 'home');
            const status = game.competitions?.[0]?.status || {};
            const clock = game.competitions?.[0]?.clock || 0;
            const period = game.competitions?.[0]?.period || 0;

            if (!away || !home) return;

            // Apply team colors to panels
            const leftColor = getTeamColor(away.team.abbreviation);
            const rightColor = getTeamColor(home.team.abbreviation);
            document.getElementById('leftPanel').style.borderRight = `3px solid ${leftColor}`;
            document.getElementById('rightPanel').style.borderLeft = `3px solid ${rightColor}`;

            // Update team info
            updateTeamPanel('left', away, game);
            updateTeamPanel('right', home, game);

            // Update center score
            document.getElementById('leftTeamNameScore').textContent = away.team.displayName;
            document.getElementById('rightTeamNameScore').textContent = home.team.displayName;
            document.getElementById('leftScoreMain').textContent = away.score || '0';
            document.getElementById('rightScoreMain').textContent = home.score || '0';

            // Update game time
            let timeStr = `Q${period} ${Math.floor(clock / 60)}:${String(Math.floor(clock % 60)).padStart(2, '0')}`;
            if (status.type?.description?.includes('Final')) timeStr = 'FINAL';
            document.getElementById('gameTimeMain').textContent = timeStr;
            document.getElementById('gameStatus').textContent = status.type?.description || 'Scheduled';

            // Render initial stats
            renderTeamStats('left', away);
            renderTeamStats('right', home);
        }

        function updateTeamPanel(side, team, game) {
            const prefix = side === 'left' ? 'left' : 'right';
            document.getElementById(`${prefix}TeamLogo`).textContent = team.team?.abbreviation || '🏀';
            document.getElementById(`${prefix}TeamName`).textContent = team.team?.displayName || 'Team';
            document.getElementById(`${prefix}TeamRecord`).textContent = team.records?.[0]?.summary || '0-0';
        }

        function renderTeamStats(side, team) {
            const stats = team.statistics || [];
            const containerId = `${side}Content`;

            const statMap = {
                'fieldGoalPct': { label: 'Field Goal %', isPercentage: true },
                'threePointPct': { label: 'Three Point %', isPercentage: true },
                'freeThrowPct': { label: 'Free Throw %', isPercentage: true },
                'points': { label: 'Points', isPercentage: false },
                'rebounds': { label: 'Rebounds', isPercentage: false },
                'assists': { label: 'Assists', isPercentage: false },
                'steals': { label: 'Steals', isPercentage: false },
                'blocks': { label: 'Blocks', isPercentage: false },
                'turnovers': { label: 'Turnovers', isPercentage: false },
                'personalFouls': { label: 'Personal Fouls', isPercentage: false },
            };

            let html = '';
            Object.entries(statMap).forEach(([key, config]) => {
                const stat = stats.find(s => s.name === key);
                const value = stat?.displayValue || '--';
                
                if (config.isPercentage && value !== '--') {
                    const numValue = parseFloat(value);
                    const barWidth = numValue;
                    html += `
                        <div class="stat-row">
                            <span class="stat-label">${config.label}</span>
                            <div class="stat-value-container">
                                <div class="stat-bar-container">
                                    <div class="stat-bar-fill" style="width: ${barWidth}%;">
                                        <span class="stat-bar-text">${numValue}%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="stat-row">
                            <span class="stat-label">${config.label}</span>
                            <div class="stat-value-container">
                                <span class="stat-value">${value}</span>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById(containerId).innerHTML = html;
        }

        // ============ View Mode Switching ============
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const panel = e.target.dataset.panel;
                const view = e.target.dataset.view;

                e.target.parentElement.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                appState.viewMode[panel] = view;

                const game = appState.currentGame;
                const competitors = game.competitions?.[0]?.competitors || [];
                const team = panel === 'left' 
                    ? competitors.find(c => c.homeAway === 'away')
                    : competitors.find(c => c.homeAway === 'home');

                if (!team) return;

                if (view === 'team') {
                    renderTeamStats(panel, team);
                }
            });
        });

        // ============ Refresh Data ============
        async function refreshGame() {
            if (appState.isTestMode) return;

            try {
                const url = CORS_PROXY + encodeURIComponent(NBA_API);
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch');
                
                const data = await response.json();
                const updatedGame = data.events?.find(g => g.id === appState.currentGameId);
                
                if (updatedGame) {
                    appState.currentGame = updatedGame;
                    renderGame();
                }
            } catch (error) {
                console.error('Refresh error:', error);
            }
        }

        function startAutoRefresh() {
            if (appState.refreshInterval) clearInterval(appState.refreshInterval);
            appState.refreshInterval = setInterval(refreshGame, 15000);
        }

        // ============ Controls ============
        document.getElementById('refreshBtn').addEventListener('click', refreshGame);
        document.getElementById('homeBtn').addEventListener('click', () => {
            if (appState.refreshInterval) clearInterval(appState.refreshInterval);
            appState.isStarted = false;
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('gameSelector').classList.remove('hidden');
            loadAvailableGames();
        });
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const container = document.getElementById('mainApp');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.warn('Fullscreen failed'));
            } else {
                document.exitFullscreen();
            }
        });

        // ============ Initialize ============
        window.addEventListener('DOMContentLoaded', loadAvailableGames);
    </script>
</body>
</html>
