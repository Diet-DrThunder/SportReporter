<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>StatBars Broadcast Mode — Projector Optimized</title>
<style>
  :root{
    --panel-width:360px;            /* medium panels for ViewSonic PA503S */
    --topbar-height:120px;         /* black bars top/bottom as requested */
    --bottombar-height:120px;
    --bg:#000;
    --panel-bg:rgba(0,0,0,0.56);
    --panel-border:rgba(255,255,255,0.06);
    --muted:rgba(255,255,255,0.56);
    --strong:#ffffff;
    --bar-bg:rgba(255,255,255,0.08);
    --bar-border:rgba(255,255,255,0.14);
    --radius:4px;
    --font-sans: "Arial", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --small-scale: 0.92;           /* overall vertical compression scale */
  }

  /* Reset */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;background:var(--bg);color:var(--strong);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}

  /* Top/Bottom black bars (theatre mode) */
  .theatre-top, .theatre-bottom{
    width:100%;
    background:#000;
    flex:0 0 auto;
  }
  .theatre-top{height:var(--topbar-height)}
  .theatre-bottom{height:var(--bottombar-height)}

  /* Layout */
  .broadcast-viewport{
    display:flex;
    height: calc(100vh - var(--topbar-height) - var(--bottombar-height));
    width:100%;
    align-items:stretch;
    justify-content:stretch;
    gap:0;
    transform: scale(var(--small-scale));
    transform-origin: center top;
  }

  .stats-panel{
    width:var(--panel-width);
    min-width:var(--panel-width);
    height:100%;
    background:var(--panel-bg);
    border-right:1px solid var(--panel-border);
    display:flex;
    flex-direction:column;
    padding:14px 12px;
    overflow:auto;
    backdrop-filter: blur(4px);
  }
  .stats-panel.right{border-right:none;border-left:1px solid var(--panel-border)}

  .broadcast-center{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    position:relative;
    overflow:hidden;
  }

  /* Team header */
  .team-header{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .team-logo{width:60px;height:60px;border-radius:6px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .team-logo img{width:100%;height:100%;object-fit:contain;display:block}
  .team-meta{display:flex;flex-direction:column;gap:2px}
  .team-name{font-size:1.12rem;font-weight:800;letter-spacing:0.2px}
  .team-record{font-size:0.86rem;color:var(--muted)}

  /* Stats list (compressed) */
  .stats-list{display:flex;flex-direction:column;gap:6px}
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
  .stat-left{display:flex;align-items:center;gap:8px;min-width:110px}
  .stat-label{font-size:0.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;width:60px}
  .stat-value-container{display:flex;align-items:center;gap:8px}
  .stat-value{font-weight:800;font-size:0.98rem;min-width:40px;text-align:right}
  .stat-bar-container{width:150px;height:16px;background:var(--bar-bg);border:1px solid var(--bar-border);border-radius:6px;overflow:hidden}
  .stat-bar-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-weight:700;font-size:0.68rem;border-radius:6px}

  /* Broadcast area */
  .broadcast-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#666;pointer-events:none}
  .broadcast-video{width:100%;height:100%;object-fit:contain;background:#0a0a0a;display:block}

  /* Small helpers */
  .muted{color:var(--muted)}
  .center-note{font-size:0.95rem;color:#666}
  .hidden{display:none}

  /* Scrollbar (subtle) */
  .stats-panel::-webkit-scrollbar{width:8px}
  .stats-panel::-webkit-scrollbar-track{background:transparent}
  .stats-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:8px}
  .stats-panel::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.09)}

  /* Responsive fallback for very narrow screens */
  @media (max-width:1000px){
    :root{--panel-width:300px}
    .stat-bar-container{width:120px}
  }
  @media (max-width:760px){
    .stats-panel{display:none}
  }

  /* subtle transition for bar changes */
  .stat-bar-fill{transition:width 400ms ease, background 400ms ease}
</style>
</head>
<body>

  <!-- Top black bar (theatre) -->
  <div class="theatre-top" aria-hidden="true"></div>

  <!-- Main broadcast viewport (panels + center) -->
  <div class="broadcast-viewport" id="viewport">

    <!-- LEFT PANEL -->
    <aside class="stats-panel" id="leftPanel" aria-label="Left team stats">
      <div class="team-header">
        <div class="team-logo"><img id="leftLogo" alt="Left team logo"></div>
        <div class="team-meta">
          <div class="team-name" id="leftName">Away</div>
          <div class="team-record" id="leftRecord">0-0</div>
        </div>
      </div>
      <div class="stats-list" id="leftStats" aria-live="polite"></div>
    </aside>

    <!-- CENTER BROADCAST -->
    <main class="broadcast-center" id="center" aria-label="Broadcast area">
      <!-- Hidden file input to load local video or image; double-click center to open -->
      <input id="fileInput" type="file" accept="video/*,image/*" class="hidden" />
      <video id="broadcastVideo" class="broadcast-video" playsinline muted></video>
      <div class="broadcast-placeholder" id="placeholder">
        <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.12">
          <rect x="2" y="6" width="20" height="14" rx="2" ry="2"></rect>
          <polyline points="8 3 12 7 16 3"></polyline>
        </svg>
        <div class="center-note">Broadcast Area</div>
        <div class="muted" style="font-size:0.86rem">Double‑click to load a local video or image</div>
      </div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="stats-panel right" id="rightPanel" aria-label="Right team stats">
      <div class="team-header">
        <div class="team-logo"><img id="rightLogo" alt="Right team logo"></div>
        <div class="team-meta">
          <div class="team-name" id="rightName">Home</div>
          <div class="team-record" id="rightRecord">0-0</div>
        </div>
      </div>
      <div class="stats-list" id="rightStats" aria-live="polite"></div>
    </aside>

  </div>

  <!-- Bottom black bar (theatre) -->
  <div class="theatre-bottom" aria-hidden="true"></div>

<script>
/*
  Single-file index.html JavaScript
  - Includes all NBA teams
  - Implements: compressed stat rows, rounded stat bars, team color gradients,
    removed score/time bar, header hidden, medium panels (~360px), black bars top/bottom 120px,
    tighter padding, smaller fonts, test mode, double-click to load local video/image.
*/

/* -------------------------
   Full NBA team color data (30 teams)
   Colors chosen as primary/secondary approximations for stat bar gradients.
   ------------------------- */
const TEAM_DATA = {
  ATL: { name: "Hawks", primary: "#E03A3E", secondary: "#061922" },
  BOS: { name: "Celtics", primary: "#007A33", secondary: "#BA9653" },
  BKN: { name: "Nets", primary: "#000000", secondary: "#FFFFFF" },
  CHA: { name: "Hornets", primary: "#00788D", secondary: "#1BA1D7" },
  CHI: { name: "Bulls", primary: "#CE1141", secondary: "#000000" },
  CLE: { name: "Cavaliers", primary: "#6F2DA8", secondary: "#041E42" },
  DAL: { name: "Mavericks", primary: "#00538C", secondary: "#B8C4CA" },
  DEN: { name: "Nuggets", primary: "#0E2240", secondary: "#FFB81C" },
  DET: { name: "Pistons", primary: "#C8102E", secondary: "#1D42BA" },
  GSW: { name: "Warriors", primary: "#1D428A", secondary: "#FFC72C" },
  HOU: { name: "Rockets", primary: "#CE1141", secondary: "#000000" },
  IND: { name: "Pacers", primary: "#002D62", secondary: "#FDBB2F" },
  LAC: { name: "Clippers", primary: "#C60C30", secondary: "#1D428A" },
  LAL: { name: "Lakers", primary: "#552583", secondary: "#FDB927" },
  MEM: { name: "Grizzlies", primary: "#12173F", secondary: "#FDB827" },
  MIA: { name: "Heat", primary: "#98002E", secondary: "#F9A01B" },
  MIL: { name: "Bucks", primary: "#00471B", secondary: "#EEE1AA" },
  MIN: { name: "Timberwolves", primary: "#0C2340", secondary: "#236B8E" },
  NOP: { name: "Pelicans", primary: "#0C2C56", secondary: "#C4CED4" },
  NYK: { name: "Knicks", primary: "#0C2340", secondary: "#F58426" },
  OKC: { name: "Thunder", primary: "#007AC1", secondary: "#EF3B39" },
  ORL: { name: "Magic", primary: "#0072CE", secondary: "#C41E3A" },
  PHI: { name: "76ers", primary: "#1D428A", secondary: "#C4CED4" },
  PHX: { name: "Suns", primary: "#E56020", secondary: "#1D1160" },
  POR: { name: "Trail Blazers", primary: "#E03A3E", secondary: "#000000" },
  SAC: { name: "Kings", primary: "#5A2D81", secondary: "#63727A" },
  SAS: { name: "Spurs", primary: "#C4CED4", secondary: "#000000" },
  TOR: { name: "Raptors", primary: "#CE1141", secondary: "#000000" },
  UTA: { name: "Jazz", primary: "#00471B", secondary: "#F9A01B" },
  WAS: { name: "Wizards", primary: "#002B5C", secondary: "#F0163F" }
};

/* -------------------------
   DOM references
   ------------------------- */
const leftNameEl = document.getElementById('leftName');
const leftRecordEl = document.getElementById('leftRecord');
const leftLogoEl = document.getElementById('leftLogo');
const leftStatsEl = document.getElementById('leftStats');

const rightNameEl = document.getElementById('rightName');
const rightRecordEl = document.getElementById('rightRecord');
const rightLogoEl = document.getElementById('rightLogo');
const rightStatsEl = document.getElementById('rightStats');

const broadcastVideo = document.getElementById('broadcastVideo');
const placeholder = document.getElementById('placeholder');
const fileInput = document.getElementById('fileInput');
const center = document.getElementById('center');

let isTestMode = false;
let currentLeft = null;
let currentRight = null;

/* -------------------------
   Utility helpers
   ------------------------- */
function clamp(v, a=0, b=100){ return Math.max(a, Math.min(b, v)); }
function safeNumber(v){ const n = parseFloat(String(v).replace('%','')); return Number.isFinite(n) ? n : null; }
function gradientFor(abbr){
  const team = TEAM_DATA[abbr];
  if(!team) return 'linear-gradient(90deg,#444,#666)';
  const p = team.primary;
  const s = team.secondary;
  // use semi-transparent stops for subtle projector-friendly look
  return `linear-gradient(90deg, ${p}CC 0%, ${s}99 100%)`;
}

/* -------------------------
   Create stat row (compressed)
   ------------------------- */
function createStatRow(label, value, isPercent, teamAbbr){
  const row = document.createElement('div');
  row.className = 'stat-row';

  const left = document.createElement('div');
  left.className = 'stat-left';
  const labelEl = document.createElement('div');
  labelEl.className = 'stat-label';
  labelEl.textContent = label;
  left.appendChild(labelEl);

  const right = document.createElement('div');
  right.className = 'stat-value-container';

  if(isPercent){
    const barContainer = document.createElement('div');
    barContainer.className = 'stat-bar-container';

    const fill = document.createElement('div');
    fill.className = 'stat-bar-fill';
    const pct = safeNumber(value);
    const widthPct = pct === null ? 0 : clamp(Math.round(pct), 0, 100);
    fill.style.width = widthPct + '%';
    fill.style.background = gradientFor(teamAbbr);
    fill.textContent = (pct === null ? '--' : `${widthPct}%`);
    barContainer.appendChild(fill);
    right.appendChild(barContainer);

    const valEl = document.createElement('div');
    valEl.className = 'stat-value';
    valEl.textContent = (pct === null ? '--' : `${pct}`);
    right.appendChild(valEl);
  } else {
    const valEl = document.createElement('div');
    valEl.className = 'stat-value';
    valEl.textContent = (value === null || value === undefined) ? '--' : value;
    right.appendChild(valEl);
  }

  row.appendChild(left);
  row.appendChild(right);
  return row;
}

/* -------------------------
   Render team panel (left or right)
   - Accepts a team object shaped like ESPN's competitor object or our test object
   ------------------------- */
function renderTeamPanel(side, teamObj){
  const isLeft = side === 'left';
  const nameEl = isLeft ? leftNameEl : rightNameEl;
  const recordEl = isLeft ? leftRecordEl : rightRecordEl;
  const logoEl = isLeft ? leftLogoEl : rightLogoEl;
  const statsEl = isLeft ? leftStatsEl : rightStatsEl;

  // Basic meta
  const displayName = teamObj.team?.displayName || teamObj.displayName || teamObj.name || 'Team';
  const abbr = teamObj.team?.abbreviation || teamObj.abbreviation || (displayName.split(' ')[0] || '').slice(0,3).toUpperCase();
  nameEl.textContent = displayName;
  recordEl.textContent = (teamObj.records && teamObj.records[0] && teamObj.records[0].summary) ? teamObj.records[0].summary : '0-0';

  // logo: try ESPN CDN if abbreviation present
  if(abbr){
    logoEl.src = `https://a.espncdn.com/i/teamlogos/nba/500/${abbr.toLowerCase()}.png`;
    logoEl.alt = abbr;
  } else {
    logoEl.src = '';
    logoEl.alt = 'logo';
  }

  // Stats mapping and order (compressed)
  const statMap = [
    { key: 'fieldGoalPct', label: 'FG%', isPct: true },
    { key: 'threePointPct', label: '3P%', isPct: true },
    { key: 'freeThrowPct', label: 'FT%', isPct: true },
    { key: 'points', label: 'PTS', isPct: false },
    { key: 'rebounds', label: 'REB', isPct: false },
    { key: 'assists', label: 'AST', isPct: false },
    { key: 'steals', label: 'STL', isPct: false },
    { key: 'blocks', label: 'BLK', isPct: false },
    { key: 'turnovers', label: 'TOV', isPct: false },
    { key: 'personalFouls', label: 'FOUL', isPct: false }
  ];

  // Clear existing
  statsEl.innerHTML = '';

  // Source stats: some payloads use statistics array, some use simple object
  const statsArray = teamObj.statistics || teamObj.stats || [];
  const statsMap = {};
  if(Array.isArray(statsArray)){
    statsArray.forEach(s => {
      if(!s) return;
      const name = s.name || s.statId || s.displayName;
      const display = s.displayValue ?? s.value ?? s.display ?? s;
      if(name) statsMap[name] = display;
    });
  } else if(typeof statsArray === 'object'){
    Object.assign(statsMap, statsArray);
  }

  // Render rows
  statMap.forEach(spec => {
    // try multiple key formats
    let raw = statsMap[spec.key] ?? statsMap[spec.key.replace(/([A-Z])/g,' $1').toLowerCase()] ?? statsMap[spec.label] ?? '--';
    if(typeof raw === 'object' && raw.displayValue) raw = raw.displayValue;
    if(typeof raw === 'string' && raw.includes('%')) raw = raw.replace('%','').trim();
    const value = (raw === '--' || raw === null || raw === undefined) ? '--' : raw;
    const row = createStatRow(spec.label, value, spec.isPct, abbr);
    statsEl.appendChild(row);
  });
}

/* -------------------------
   Test data generation (robust)
   ------------------------- */
function randomInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function getRandomTeamAbbr(){
  const keys = Object.keys(TEAM_DATA);
  return keys[Math.floor(Math.random()*keys.length)];
}
function generateRandomStats(){
  return {
    fieldGoalPct: (randomInt(40,60)).toString(),
    threePointPct: (randomInt(28,45)).toString(),
    freeThrowPct: (randomInt(70,92)).toString(),
    points: randomInt(80,130).toString(),
    rebounds: randomInt(30,60).toString(),
    assists: randomInt(15,35).toString(),
    steals: randomInt(3,12).toString(),
    blocks: randomInt(1,10).toString(),
    turnovers: randomInt(5,18).toString(),
    personalFouls: randomInt(8,22).toString()
  };
}
function generateTestTeam(abbr){
  const teamInfo = TEAM_DATA[abbr] || { name: abbr, primary:'#444', secondary:'#666' };
  const stats = generateRandomStats();
  return {
    team: { abbreviation: abbr, displayName: teamInfo.name || abbr },
    displayName: teamInfo.name || abbr,
    abbreviation: abbr,
    records: [{ summary: `${randomInt(10,45)}-${randomInt(10,45)}` }],
    statistics: Object.entries(stats).map(([k,v]) => ({ name:k, displayValue: v }))
  };
}
function enterTestMode(){
  isTestMode = true;
  const leftAbbr = getRandomTeamAbbr();
  let rightAbbr = getRandomTeamAbbr();
  while(rightAbbr === leftAbbr) rightAbbr = getRandomTeamAbbr();

  currentLeft = generateTestTeam(leftAbbr);
  currentRight = generateTestTeam(rightAbbr);

  renderTeamPanel('left', currentLeft);
  renderTeamPanel('right', currentRight);
}

/* -------------------------
   Video / placeholder handling
   ------------------------- */
function showPlaceholder(show){
  placeholder.style.display = show ? 'flex' : 'none';
  broadcastVideo.style.display = show ? 'none' : 'block';
}
showPlaceholder(true);

center.addEventListener('dblclick', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  if(file.type.startsWith('image/')){
    // For images, replace center content with an <img> (keeps panels intact)
    const img = new Image();
    img.src = url;
    img.style.maxWidth = '100%';
    img.style.maxHeight = '100%';
    img.style.objectFit = 'contain';
    img.style.display = 'block';
    // remove existing children except file input
    while(center.firstChild) center.removeChild(center.firstChild);
    center.appendChild(fileInput); // keep file input for future loads
    center.appendChild(img);
  } else {
    // video
    // if center currently has an image from previous load, restore structure
    if(!document.body.contains(broadcastVideo)){
      // rebuild center structure
      while(center.firstChild) center.removeChild(center.firstChild);
      center.appendChild(fileInput);
      center.appendChild(broadcastVideo);
      center.appendChild(placeholder);
    }
    broadcastVideo.src = url;
    broadcastVideo.loop = true;
    broadcastVideo.muted = true;
    broadcastVideo.play().catch(()=>{ /* autoplay may be blocked; user can unmute locally */ });
    showPlaceholder(false);
  }
});

/* -------------------------
   Keyboard shortcuts & controls
   - T toggles test mode (user requested test mode earlier)
   - R regenerates test stats
   - C clears panels
   ------------------------- */
window.addEventListener('keydown', (e) => {
  if(e.key === 't' || e.key === 'T'){ // toggle test mode
    isTestMode = !isTestMode;
    if(isTestMode) enterTestMode();
    else {
      // clear panels
      leftNameEl.textContent = 'Away'; leftRecordEl.textContent = '0-0'; leftLogoEl.src=''; leftStatsEl.innerHTML='';
      rightNameEl.textContent = 'Home'; rightRecordEl.textContent = '0-0'; rightLogoEl.src=''; rightStatsEl.innerHTML='';
    }
  }
  if(e.key === 'r' || e.key === 'R'){ // refresh test stats if in test mode
    if(isTestMode) enterTestMode();
  }
  if(e.key === 'c' || e.key === 'C'){ // clear
    isTestMode = false;
    leftNameEl.textContent = 'Away'; leftRecordEl.textContent = '0-0'; leftLogoEl.src=''; leftStatsEl.innerHTML='';
    rightNameEl.textContent = 'Home'; rightRecordEl.textContent = '0-0'; rightLogoEl.src=''; rightStatsEl.innerHTML='';
  }
});

/* -------------------------
   Initialization
   ------------------------- */
(function init(){
  // Start in test mode by default so the user sees something on first load
  enterTestMode();

  // Keep placeholder visible until a video is loaded
  showPlaceholder(true);

  // Accessibility: allow double-click hint to be keyboard accessible (Enter on center)
  center.tabIndex = 0;
  center.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') fileInput.click();
  });
})();

</script>
</body>
</html>
