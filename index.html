<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>StatBars Broadcast Mode — Live ESPN Stats</title>
<style>
  :root{
    --left-right-width:16%;        /* sidebars compressed to 16% */
    --min-panel-width:260px;       /* keep readable on low res */
    --topbar-height:160px;
    --bottombar-height:100px;
    --bg:#000;
    --panel-bg:rgba(0,0,0,0.56);
    --muted:rgba(255,255,255,0.56);
    --strong:#fff;
    --bar-bg:rgba(255,255,255,0.04);
    --bar-border:rgba(255,255,255,0.08);
    --small-scale:0.92;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;background:var(--bg);color:var(--strong);font-family:Arial,system-ui;overflow:hidden}
  .theatre-top,.theatre-bottom{width:100%;background:#000;flex:0 0 auto}
  .theatre-top{height:var(--topbar-height)} .theatre-bottom{height:var(--bottombar-height)}
  .viewport{display:flex;height:calc(100vh - var(--topbar-height) - var(--bottombar-height));gap:0;transform:scale(var(--small-scale));transform-origin:center top}
  .panel{width:var(--left-right-width);min-width:var(--min-panel-width);background:var(--panel-bg);padding:12px;overflow:auto;display:flex;flex-direction:column}
  .panel.right{border-left:1px solid rgba(255,255,255,0.06)}
  .center{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .team-header{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .team-logo img{width:64px;height:64px;object-fit:contain;display:block}
  .team-name{font-weight:800;font-size:1.05rem}
  .team-record{color:var(--muted);font-size:0.86rem}
  .stats-list{display:flex;flex-direction:column;gap:6px}
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
  .stat-label{font-size:0.68rem;font-weight:800;color:var(--muted);width:60px;text-transform:uppercase}
  .stat-value{font-weight:800;min-width:40px;text-align:right}
  .stat-bar{width:150px;height:16px;background:var(--bar-bg);border-radius:6px;overflow:hidden;border:1px solid var(--bar-border)}
  .stat-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-weight:700;font-size:0.68rem;transition:width 400ms}
  .homescreen{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:1200;display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:18px;padding:28px}
  .panel-ui{width:min(980px,92vw);background:rgba(20,20,20,0.9);padding:18px;border-radius:8px;display:flex;gap:12px}
  .btn{background:#111;border:1px solid rgba(255,255,255,0.06);color:#fff;padding:10px 14px;border-radius:6px;cursor:pointer;font-weight:700}
  .games-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
  .game-option{padding:10px;border-radius:6px;background:rgba(255,255,255,0.02);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .delay-control{position:fixed;left:12px;bottom:calc(var(--bottombar-height) + 8px);z-index:1300;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.04);padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:0.9rem}
  .delay-control input[type="range"]{width:160px}
  .muted{color:var(--muted)}
  @media (max-width:900px){ :root{--left-right-width:28%} }
  @media (max-width:760px){ .panel{display:none} }
</style>
</head>
<body>

<!-- Homescreen -->
<div class="homescreen" id="homescreen" role="dialog" aria-modal="true">
  <div style="text-align:center"><h1>StatBars</h1><div class="muted">Select a live game or use Test Mode</div></div>
  <div class="panel-ui">
    <div style="flex:1">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn" id="todayBtn">Games Today</button>
        <button class="btn" id="tomorrowBtn">Games Tomorrow</button>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
      <div class="games-list" id="gamesList"></div>
    </div>
    <div style="width:320px;display:flex;flex-direction:column;gap:10px">
      <div style="font-weight:800">Quick Actions</div>
      <button class="btn" id="testBtn">Enter Test Mode</button>
      <button class="btn" id="closeHomescreen">Close</button>
      <div style="margin-top:8px"><div style="font-weight:800">Info</div><div class="muted" style="font-size:0.92rem">Delay slider offsets stat updates 0–30s to sync with broadcast. Double‑click center to load a local video/image.</div></div>
    </div>
  </div>
</div>

<div class="theatre-top" aria-hidden="true"></div>

<div class="viewport" id="viewport">
  <aside class="panel" id="leftPanel">
    <div class="team-header">
      <div class="team-logo"><img id="leftLogo" alt=""></div>
      <div>
        <div class="team-name" id="leftName">Away</div>
        <div class="team-record" id="leftRecord">0-0</div>
      </div>
    </div>
    <div class="stats-list" id="leftStats" aria-live="polite"></div>
  </aside>

  <main class="center" id="center">
    <input id="fileInput" type="file" accept="video/*,image/*" style="display:none" />
    <video id="video" class="broadcast-video" playsinline muted style="display:none"></video>
    <div class="broadcast-placeholder" id="placeholder">
      <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.12"><rect x="2" y="6" width="20" height="14" rx="2"></rect><polyline points="8 3 12 7 16 3"></polyline></svg>
      <div class="muted">Broadcast Area — double‑click to load local media</div>
    </div>
  </main>

  <aside class="panel right" id="rightPanel">
    <div class="team-header">
      <div class="team-logo"><img id="rightLogo" alt=""></div>
      <div>
        <div class="team-name" id="rightName">Home</div>
        <div class="team-record" id="rightRecord">0-0</div>
      </div>
    </div>
    <div class="stats-list" id="rightStats" aria-live="polite"></div>
  </aside>
</div>

<div class="delay-control" id="delayControl">
  <div style="font-weight:700">Delay</div>
  <input id="delaySlider" type="range" min="0" max="30" value="0" />
  <div id="delayLabel">0s</div>
</div>

<div class="theatre-bottom" aria-hidden="true"></div>

<script>
/* Live schedule + live stats from ESPN scoreboard API.
   Uses scoreboard endpoint to list games and to refresh game data (competitions[].statistics).
   Falls back to a CORS proxy if direct fetch fails. */
const ESPN_SCOREBOARD = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

const homescreen = document.getElementById('homescreen');
const gamesList = document.getElementById('gamesList');
const todayBtn = document.getElementById('todayBtn');
const tomorrowBtn = document.getElementById('tomorrowBtn');
const refreshBtn = document.getElementById('refreshBtn');
const testBtn = document.getElementById('testBtn');
const closeHomescreen = document.getElementById('closeHomescreen');

const leftName = document.getElementById('leftName');
const leftRecord = document.getElementById('leftRecord');
const leftLogo = document.getElementById('leftLogo');
const leftStats = document.getElementById('leftStats');

const rightName = document.getElementById('rightName');
const rightRecord = document.getElementById('rightRecord');
const rightLogo = document.getElementById('rightLogo');
const rightStats = document.getElementById('rightStats');

const delaySlider = document.getElementById('delaySlider');
const delayLabel = document.getElementById('delayLabel');

const video = document.getElementById('video');
const placeholder = document.getElementById('placeholder');
const fileInput = document.getElementById('fileInput');
const center = document.getElementById('center');

let statDelay = 0;
let refreshInterval = null;
let currentGameId = null;
let pendingTimeout = null;
let isTest = false;

// helper: fetch with proxy fallback
async function fetchJson(url){
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('fetch failed');
    return await r.json();
  }catch(e){
    const prox = CORS_PROXY + encodeURIComponent(url);
    const r2 = await fetch(prox);
    if(!r2.ok) throw new Error('proxy failed');
    return await r2.json();
  }
}
function ymd(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}${m}${day}`; }

// load games for date
async function loadGames(dateLabel){
  const d = new Date();
  if(dateLabel==='tomorrow') d.setDate(d.getDate()+1);
  const dateParam = ymd(d);
  try{
    const data = await fetchJson(`${ESPN_SCOREBOARD}?dates=${dateParam}`);
    const events = data.events ?? [];
    renderGames(events);
  }catch(err){
    gamesList.innerHTML = `<div class="muted">Failed to load games: ${err.message}</div>`;
  }
}
function renderGames(events){
  gamesList.innerHTML = '';
  if(!events.length){ gamesList.innerHTML = '<div class="muted">No games</div>'; return; }
  events.forEach(ev=>{
    const comp = ev.competitions?.[0]?.competitors ?? [];
    const away = comp.find(c=>c.homeAway==='away');
    const home = comp.find(c=>c.homeAway==='home');
    const status = ev.status?.type?.description ?? ev.status ?? '';
    const time = ev.date ? new Date(ev.date).toLocaleString() : '';
    const el = document.createElement('div'); el.className='game-option';
    el.innerHTML = `<div style="font-weight:700">${away?.team?.abbreviation || 'AW'} @ ${home?.team?.abbreviation || 'HM'}</div><div style="color:var(--muted);font-size:0.92rem">${status} • ${time}</div>`;
    el.addEventListener('click', ()=>selectGame(ev.id));
    gamesList.appendChild(el);
  });
}

async function selectGame(gameId){
  // fetch scoreboard and find game
  try{
    const data = await fetchJson(`${ESPN_SCOREBOARD}`);
    const events = data.events ?? [];
    const game = events.find(e=>e.id===gameId);
    if(!game){ alert('Game not found'); return; }
    currentGameId = gameId;
    isTest = false;
    homescreen.style.display = 'none';
    applyGame(game);
    startAutoRefresh();
  }catch(err){
    alert('Failed to load game: '+err.message);
  }
}

function applyGame(game){
  const comp = game.competitions?.[0]?.competitors ?? [];
  const away = comp.find(c=>c.homeAway==='away');
  const home = comp.find(c=>c.homeAway==='home');
  renderPanel('left', away);
  renderPanel('right', home);
}

// render panel with delay applied
function renderPanel(side, teamObj){
  if(pendingTimeout) clearTimeout(pendingTimeout);
  pendingTimeout = setTimeout(()=>{
    const isLeft = side==='left';
    const nameEl = isLeft?leftName:rightName;
    const recordEl = isLeft?leftRecord:rightRecord;
    const logoEl = isLeft?leftLogo:rightLogo;
    const statsEl = isLeft?leftStats:rightStats;
    const display = teamObj.team?.displayName || teamObj.team?.name || teamObj.team?.abbreviation || 'Team';
    const abbr = teamObj.team?.abbreviation || (display.split(' ')[0]||'').slice(0,3).toUpperCase();
    nameEl.textContent = display;
    recordEl.textContent = teamObj.records?.[0]?.summary ?? '0-0';
    if(abbr){ logoEl.src = `https://a.espncdn.com/i/teamlogos/nba/500/${abbr.toLowerCase()}.png`; logoEl.alt = abbr; } else { logoEl.src=''; logoEl.alt=''; }
    // stat map (no PTS)
    const statMap = [
      {key:'fieldGoalPct',label:'FG%',isPct:true},
      {key:'threePointPct',label:'3P%',isPct:true},
      {key:'freeThrowPct',label:'FT%',isPct:true},
      {key:'rebounds',label:'REB',isPct:false},
      {key:'assists',label:'AST',isPct:false},
      {key:'steals',label:'STL',isPct:false},
      {key:'blocks',label:'BLK',isPct:false},
      {key:'turnovers',label:'TOV',isPct:false},
      {key:'personalFouls',label:'FOUL',isPct:false}
    ];
    statsEl.innerHTML = '';
    const statsArray = teamObj.statistics ?? [];
    const map = {};
    if(Array.isArray(statsArray)) statsArray.forEach(s=>{ if(!s) return; map[s.name]=s.displayValue ?? s.value ?? s; });
    statMap.forEach(spec=>{
      let raw = map[spec.key] ?? '--';
      if(typeof raw==='string' && raw.includes('%')) raw = raw.replace('%','').trim();
      const value = (raw===null||raw===undefined)?'--':raw;
      const row = createRow(spec.label, value, spec.isPct, abbr);
      statsEl.appendChild(row);
    });
  }, statDelay*1000);
}

function createRow(label,value,isPct,abbr){
  const row=document.createElement('div'); row.className='stat-row';
  const left=document.createElement('div'); left.className='stat-left';
  const labelEl=document.createElement('div'); labelEl.className='stat-label'; labelEl.textContent=label; left.appendChild(labelEl);
  const right=document.createElement('div'); right.className='stat-value-container';
  if(isPct){
    const bar=document.createElement('div'); bar.className='stat-bar';
    const fill=document.createElement('div'); fill.className='stat-fill';
    const n = parseFloat(String(value).replace('%','')); const pct = Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):0;
    fill.style.width = pct + '%';
    const color = (window.TEAM_COLORS && TEAM_COLORS[abbr]) ? TEAM_COLORS[abbr] : '#666';
    fill.style.background = color + 'CC';
    fill.textContent = Number.isFinite(n)?(pct+'%'):'--';
    bar.appendChild(fill); right.appendChild(bar);
    const val=document.createElement('div'); val.className='stat-value'; val.textContent = Number.isFinite(n)?String(n):'--'; right.appendChild(val);
  } else {
    const val=document.createElement('div'); val.className='stat-value'; val.textContent = value; right.appendChild(val);
  }
  row.appendChild(left); row.appendChild(right); return row;
}

// auto-refresh live stats for selected game
async function refreshCurrentGame(){
  if(!currentGameId) return;
  try{
    const data = await fetchJson(`${ESPN_SCOREBOARD}`);
    const game = data.events?.find(e=>e.id===currentGameId);
    if(game) applyGame(game);
  }catch(e){
    console.warn('refresh failed',e);
  }
}
function startAutoRefresh(){
  if(refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(refreshCurrentGame, 15000); // 15s
}

// Test mode
function randomInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randAbbr(){ const keys=Object.keys(TEAM_COLORS); return keys[Math.floor(Math.random()*keys.length)]; }
function genStats(){ return { fieldGoalPct:randomInt(40,60).toString(), threePointPct:randomInt(28,45).toString(), freeThrowPct:randomInt(70,92).toString(), rebounds:randomInt(30,60).toString(), assists:randomInt(15,35).toString(), steals:randomInt(3,12).toString(), blocks:randomInt(1,10).toString(), turnovers:randomInt(5,18).toString(), personalFouls:randomInt(8,22).toString() }; }
function enterTest(){ isTest=true; const a=randAbbr(), b=randAbbr(); while(b===a) b=randAbbr(); renderPanel('left',{team:{abbreviation:a,displayName:TEAM_COLORS[a].name},records:[{summary:'0-0'}],statistics:Object.entries(genStats()).map(([k,v])=>({name:k,displayValue:v}))}); renderPanel('right',{team:{abbreviation:b,displayName:TEAM_COLORS[b].name},records:[{summary:'0-0'}],statistics:Object.entries(genStats()).map(([k,v])=>({name:k,displayValue:v}))}); homescreen.style.display='none'; }

// small team color map for stat fills (primary colors)
const TEAM_COLORS = {
  ATL:"#E03A3E",BOS:"#007A33",BKN:"#000000",CHA:"#00788D",CHI:"#CE1141",CLE:"#6F2DA8",
  DAL:"#00538C",DEN:"#0E2240",DET:"#C8102E",GSW:"#1D428A",HOU:"#CE1141",IND:"#002D62",
  LAC:"#C60C30",LAL:"#552583",MEM:"#12173F",MIA:"#98002E",MIL:"#00471B",MIN:"#0C2340",
  NOP:"#0C2C56",NYK:"#0C2340",OKC:"#007AC1",ORL:"#0072CE",PHI:"#1D428A",PHX:"#E56020",
  POR:"#E03A3E",SAC:"#5A2D81",SAS:"#C4CED4",TOR:"#CE1141",UTA:"#00471B",WAS:"#002B5C"
};

// homescreen controls
todayBtn.addEventListener('click', ()=>loadGames('today'));
tomorrowBtn.addEventListener('click', ()=>loadGames('tomorrow'));
refreshBtn.addEventListener('click', ()=>loadGames('today'));
testBtn.addEventListener('click', ()=>{ enterTest(); });
closeHomescreen.addEventListener('click', ()=>homescreen.style.display='none');

delaySlider.addEventListener('input', (e)=>{ statDelay = Number(e.target.value); delayLabel.textContent = statDelay + 's'; });

// center media
center.addEventListener('dblclick', ()=>fileInput.click());
fileInput.addEventListener('change',(e)=>{ const f=e.target.files[0]; if(!f) return; const url=URL.createObjectURL(f); if(f.type.startsWith('image/')){ const img=new Image(); img.src=url; img.style.maxWidth='100%'; img.style.maxHeight='100%'; while(center.firstChild) center.removeChild(center.firstChild); center.appendChild(fileInput); center.appendChild(img); } else { if(!document.body.contains(video)){ while(center.firstChild) center.removeChild(center.firstChild); center.appendChild(fileInput); center.appendChild(video); center.appendChild(placeholder); } video.src=url; video.loop=true; video.muted=true; video.play().catch(()=>{}); placeholder.style.display='none'; } });

// init
(async function init(){ await loadGames('today'); homescreen.style.display='flex'; delayLabel.textContent = statDelay + 's'; })();
</script>
</body>
</html>
